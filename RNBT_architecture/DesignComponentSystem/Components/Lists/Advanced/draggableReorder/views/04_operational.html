<section class="list-reorder">
  <div class="list-reorder__items" role="list" aria-label="Reorder list"></div>

  <template id="list-reorder-item-template">
    <article class="list-reorder__item" role="listitem" draggable="true" data-itemid="">
      <span class="list-reorder__handle" aria-hidden="true">drag_indicator</span>
      <span class="list-reorder__leading"></span>
      <span class="list-reorder__body">
        <strong class="list-reorder__headline"></strong>
        <span class="list-reorder__supporting"></span>
      </span>
    </article>
  </template>
</section>
