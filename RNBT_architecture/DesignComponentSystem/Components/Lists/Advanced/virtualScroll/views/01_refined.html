<section class="list-vs">

    <div class="list-vs__spacer" aria-hidden="true"></div>
    <div class="list-vs__window" role="list"></div>
  </div>

  <template id="list-vs-item-template">
    <article class="list-vs__item" role="listitem" data-itemid="">

      <span class="list-vs__body">
        <strong class="list-vs__headline"></strong>
        <span class="list-vs__supporting"></span>
      </span>
    </article>
  </template>
</section>
