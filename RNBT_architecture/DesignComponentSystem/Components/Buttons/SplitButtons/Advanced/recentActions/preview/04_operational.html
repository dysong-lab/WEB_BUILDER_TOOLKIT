<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>SplitButtons/Advanced/recentActions — 04_operational</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <script src="../../../../../../preview_runtime.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #05090b;
        color: #7deeff;
        padding: 40px;
        font-family: "JetBrains Mono", "IBM Plex Mono", monospace;
      }
      .preview-shell {
        max-width: 900px;
        margin: 0 auto;
        display: grid;
        gap: 18px;
      }
      .preview-log {
        min-height: 96px;
        padding: 16px;
        border-radius: 16px;
        background: rgba(0, 229, 255, 0.04);
        border: 1px solid rgba(0, 229, 255, 0.12);
        white-space: pre-line;
        font:
          12px/1.6 "JetBrains Mono",
          "IBM Plex Mono",
          monospace;
        color: #8bcad2;
      }
    </style>
  </head>
  <body>
    <div class="preview-shell">
      <h1>recentActions SplitButtons</h1>
      <div id="demo"></div>
      <div class="preview-log" id="log">
        Recent commands are ranked #1, #2, #3 when reopened.
      </div>
    </div>
    <script>
      (async () => {
        await loadComponentAssets(
          "demo",
          "../views/04_operational.html",
          "../styles/04_operational.css",
        );
        const root = document.querySelector("#demo .split-button");
        const log = document.getElementById("log");
        const storageKey = "preview_split_recent_operational";
        const mainAction = {
          id: "execute",
          label: "EXECUTE",
          icon: "terminal",
        };
        const menuItems = [
          { actionId: "run", label: "RUN", icon: "play_arrow" },
          { actionId: "stop", label: "STOP", icon: "stop" },
          { actionId: "restart", label: "RESTART", icon: "restart_alt" },
          { actionId: "drain", label: "DRAIN", icon: "layers_clear" },
        ];
        const token = `splitButton_recentActions_${storageKey}`;
        const action = root.querySelector(".split-button__action"),
          list = root.querySelector(".split-button__menu-list"),
          recentLabel = root.querySelector(".split-button__recent-label"),
          recentDivider = root.querySelector(".split-button__recent-divider");
        action.querySelector(".split-button__action-label").textContent =
          mainAction.label;
        action.querySelector(".split-button__action-icon").textContent =
          mainAction.icon;
        action.dataset.actionId = mainAction.id;
        const loadRecent = () => {
          try {
            return JSON.parse(localStorage.getItem(token) || "[]");
          } catch (_) {
            return [];
          }
        };
        const saveRecent = (id) =>
          localStorage.setItem(
            token,
            JSON.stringify(
              [id, ...loadRecent().filter((v) => v !== id)].slice(0, 10),
            ),
          );
        const render = () => {
          const lookup = new Map(
            menuItems.map((item) => [item.actionId, item]),
          );
          const recent = loadRecent()
            .map((id, idx) =>
              lookup.get(id) && idx < 3
                ? { ...lookup.get(id), isRecent: true, rank: idx + 1 }
                : null,
            )
            .filter(Boolean);
          recentLabel.dataset.empty = recent.length ? "false" : "true";
          recentDivider.dataset.empty = recent.length ? "false" : "true";
          list.innerHTML = [
            ...recent,
            ...menuItems.map((item) => ({
              ...item,
              isRecent: false,
              rank: "",
            })),
          ]
            .map(
              (item) =>
                `<button class="split-button__menu-item" type="button" data-action-id="${item.actionId}" data-recent="${item.isRecent}" data-recent-rank="${item.rank || ""}"><span class="split-button__menu-icon material-symbols-outlined">${item.icon}</span><span class="split-button__menu-label">${item.label}</span><span class="split-button__menu-meta">${item.isRecent ? `#${item.rank}` : ""}</span></button>`,
            )
            .join("");
        };
        const open = () => {
          render();
          root.dataset.menuState = "open";
        };
        const close = () => {
          root.dataset.menuState = "closed";
        };
        render();
        root.addEventListener("click", (event) => {
          const main = event.target.closest(".split-button__action");
          if (main) {
            log.textContent = `event: @splitMainClicked\nactionId: ${main.dataset.actionId}`;
            return;
          }
          if (event.target.closest(".split-button__trigger")) {
            root.dataset.menuState === "open" ? close() : open();
            return;
          }
          const item = event.target.closest(".split-button__menu-item");
          if (!item) return;
          saveRecent(item.dataset.actionId);
          log.textContent = `event: @splitMenuItemClicked\nactionId: ${item.dataset.actionId}\nfromRecent: ${item.dataset.recent}`;
          close();
        });
        document.addEventListener(
          "click",
          (event) => {
            if (root.dataset.menuState !== "open") return;
            if (root.contains(event.target)) return;
            close();
          },
          true,
        );
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") close();
        });
      })();
    </script>
  </body>
</html>
