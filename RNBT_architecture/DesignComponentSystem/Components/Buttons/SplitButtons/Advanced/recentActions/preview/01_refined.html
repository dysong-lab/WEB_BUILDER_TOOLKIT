<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><title>SplitButtons/Advanced/recentActions — 01_refined</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap"/><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/><script src="../../../../../../preview_runtime.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#09111b;color:#eef1ff;padding:40px;font-family:"Pretendard",sans-serif}.preview-shell{max-width:900px;margin:0 auto;display:grid;gap:18px}.preview-log{min-height:96px;padding:16px;border-radius:16px;background:rgba(255,255,255,.04);white-space:pre-line;font:12px/1.6 "IBM Plex Mono",monospace;color:#b8c3ea}</style></head><body><div class="preview-shell"><h1>recentActions SplitButtons</h1><div id="demo"></div><div class="preview-log" id="log">Open the menu, choose a route, then reopen to see it promoted into Recent.</div></div><script>(async()=>{await loadComponentAssets("demo","../views/01_refined.html","../styles/01_refined.css");const root=document.querySelector("#demo .split-button");const log=document.getElementById("log");const storageKey="preview_split_recent_refined";const mainAction={id:"share",label:"Share",icon:"share"};const menuItems=[{actionId:"email",label:"Email",icon:"mail"},{actionId:"embed",label:"Embed",icon:"code_blocks"},{actionId:"archive",label:"Archive",icon:"inventory_2"},{actionId:"link",label:"Copy link",icon:"link"}];const token=`splitButton_recentActions_${storageKey}`;const action=root.querySelector(".split-button__action"),panel=root.querySelector(".split-button__menu-panel"),list=root.querySelector(".split-button__menu-list"),recentLabel=root.querySelector(".split-button__recent-label"),recentDivider=root.querySelector(".split-button__recent-divider");action.querySelector(".split-button__action-label").textContent=mainAction.label;action.querySelector(".split-button__action-icon").textContent=mainAction.icon;action.dataset.actionId=mainAction.id;const loadRecent=()=>{try{return JSON.parse(localStorage.getItem(token)||"[]")}catch(_){return[]}};const saveRecent=(id)=>{const next=[id,...loadRecent().filter((v)=>v!==id)].slice(0,10);localStorage.setItem(token,JSON.stringify(next))};const render=()=>{const lookup=new Map(menuItems.map((item)=>[item.actionId,item]));const recent=loadRecent().map((id,idx)=>lookup.get(id)&&idx<3?{...lookup.get(id),isRecent:true,rank:idx+1}:null).filter(Boolean);recentLabel.dataset.empty=recent.length?"false":"true";recentDivider.dataset.empty=recent.length?"false":"true";const merged=[...recent,...menuItems.map((item)=>({...item,isRecent:false,rank:""}))];list.innerHTML=merged.map((item)=>`<button class="split-button__menu-item" type="button" data-action-id="${item.actionId}" data-recent="${item.isRecent}" data-recent-rank="${item.rank||""}"><span class="split-button__menu-icon material-symbols-outlined">${item.icon}</span><span class="split-button__menu-label">${item.label}</span><span class="split-button__menu-meta"></span></button>`).join("")};const open=()=>{render();root.dataset.menuState="open"};const close=()=>{root.dataset.menuState="closed"};render();root.addEventListener("click",(event)=>{const main=event.target.closest(".split-button__action");if(main){log.textContent=`event: @splitMainClicked\nactionId: ${main.dataset.actionId}`;return}if(event.target.closest(".split-button__trigger")){root.dataset.menuState==="open"?close():open();return}const item=event.target.closest(".split-button__menu-item");if(!item)return;saveRecent(item.dataset.actionId);log.textContent=`event: @splitMenuItemClicked\nactionId: ${item.dataset.actionId}\nfromRecent: ${item.dataset.recent}`;close()});document.addEventListener("click",(event)=>{if(root.dataset.menuState!=="open")return;if(root.contains(event.target))return;close()},true);document.addEventListener("keydown",(event)=>{if(event.key==="Escape")close()})})();</script></body></html>
