<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><title>SegmentedButtons/Advanced/multiSelect — 04_operational</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/><script src="../../../../../../preview_runtime.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#030910;color:#d9faff;font-family:"IBM Plex Mono",monospace;padding:36px}.preview-shell{max-width:920px;margin:0 auto;display:grid;gap:18px}.preview-log{min-height:112px;padding:16px;border-radius:18px;background:rgba(0,229,255,.04);border:1px solid rgba(0,229,255,.12);white-space:pre-line;font-size:12px;line-height:1.6;color:#92b8c2}</style></head><body><div class="preview-shell"><h1>multiSelect SegmentedButtons</h1><div id="demo"></div><div class="preview-log" id="log">Toggle multiple telemetry filters.</div></div><script>(async()=>{await loadComponentAssets("demo","../views/04_operational.html","../styles/04_operational.css");const root=document.querySelector("#demo .segmented-button-multi");const list=root.querySelector(".segmented-button-multi__list");const log=document.getElementById("log");const items=[["temp","thermostat","TEMP",true],["pressure","compress","PRESS",false],["humid","water_drop","HUMID",true],["vibe","vibration","VIBE",false]];list.innerHTML=items.map(([id,icon,label,selected])=>`<button class="segmented-button-multi__item" type="button" data-action-id="${id}" data-selected="${selected}" aria-pressed="${selected}"><span class="segmented-button-multi__icon material-symbols-outlined">${icon}</span><span class="segmented-button-multi__label">${label}</span></button>`).join("");const sync=()=>{const selected=[...list.querySelectorAll('.segmented-button-multi__item[data-selected="true"]')].map((item)=>item.dataset.actionId);root.dataset.selectedCount=String(selected.length);log.textContent=`event: @segmentMultiSelected\nselectedIds: ${selected.join(", ")||"(none)"}`};sync();root.addEventListener("click",(event)=>{const item=event.target.closest(".segmented-button-multi__item");if(!item)return;const next=item.dataset.selected!=="true";item.dataset.selected=next?"true":"false";item.setAttribute("aria-pressed",next?"true":"false");sync()})})();</script></body></html>
