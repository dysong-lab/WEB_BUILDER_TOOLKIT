<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>SegmentedButtons/Advanced/multiSelect — 03_editorial</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <script src="../../../../../../preview_runtime.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #f6efe4;
        color: #4a3b2c;
        font-family: Georgia, serif;
        padding: 36px;
      }
      .preview-shell {
        max-width: 920px;
        margin: 0 auto;
        display: grid;
        gap: 18px;
      }
      .preview-log {
        min-height: 112px;
        padding: 16px;
        border-radius: 18px;
        background: rgba(74, 59, 44, 0.06);
        border: 1px solid rgba(74, 59, 44, 0.1);
        white-space: pre-line;
        font:
          12px/1.6 "IBM Plex Mono",
          monospace;
        color: #75614d;
      }
    </style>
  </head>
  <body>
    <div class="preview-shell">
      <h1>multiSelect SegmentedButtons</h1>
      <div id="demo"></div>
      <div class="preview-log" id="log">
        Select multiple editorial lanes at once.
      </div>
    </div>
    <script>
      (async () => {
        await loadComponentAssets(
          "demo",
          "../views/03_editorial.html",
          "../styles/03_editorial.css",
        );
        const root = document.querySelector("#demo .segmented-button-multi");
        const list = root.querySelector(".segmented-button-multi__list");
        const log = document.getElementById("log");
        const items = [
          ["latest", "schedule", "Latest", true],
          ["popular", "local_fire_department", "Popular", false],
          ["featured", "star", "Featured", true],
        ];
        list.innerHTML = items
          .map(
            ([id, icon, label, selected]) =>
              `<button class="segmented-button-multi__item" type="button" data-action-id="${id}" data-selected="${selected}" aria-pressed="${selected}"><span class="segmented-button-multi__icon material-symbols-outlined">${icon}</span><span class="segmented-button-multi__label">${label}</span></button>`,
          )
          .join("");
        const sync = () => {
          const selected = [
            ...list.querySelectorAll(
              '.segmented-button-multi__item[data-selected="true"]',
            ),
          ].map((item) => item.dataset.actionId);
          root.dataset.selectedCount = String(selected.length);
          log.textContent = `event: @segmentMultiSelected\nselectedIds: ${selected.join(", ") || "(none)"}`;
        };
        sync();
        root.addEventListener("click", (event) => {
          const item = event.target.closest(".segmented-button-multi__item");
          if (!item) return;
          const next = item.dataset.selected !== "true";
          item.dataset.selected = next ? "true" : "false";
          item.setAttribute("aria-pressed", next ? "true" : "false");
          sync();
        });
      })();
    </script>
  </body>
</html>
