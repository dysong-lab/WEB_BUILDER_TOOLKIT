<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><title>SegmentedButtons/Advanced/multiSelect — 02_material</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/><script src="../../../../../../preview_runtime.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f3eee7;color:#312719;font-family:"Roboto",sans-serif;padding:36px}</style></head><body><div id="demo"></div><script>(async()=>{await loadComponentAssets("demo","../views/02_material.html","../styles/02_material.css");const root=document.querySelector("#demo .segmented-button-multi");const list=root.querySelector(".segmented-button-multi__list");const items=[["books","menu_book","Books",true],["food","lunch_dining","Food",false],["tech","memory","Tech",true]];list.innerHTML=items.map(([id,icon,label,selected])=>`<button class="segmented-button-multi__item" data-action-id="${id}" data-selected="${selected}" aria-pressed="${selected}"><span class="segmented-button-multi__icon material-symbols-outlined">${icon}</span><span class="segmented-button-multi__label">${label}</span></button>`).join("")})();</script></body></html>
