<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>SegmentedButtons/Advanced/multiSelect — 01_refined</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <script src="../../../../../../preview_runtime.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #09111b;
        color: #eaf2ff;
        font-family: "Pretendard", sans-serif;
        padding: 36px;
      }
      .preview-shell {
        max-width: 920px;
        margin: 0 auto;
        display: grid;
        gap: 18px;
      }
      .preview-log {
        min-height: 112px;
        padding: 16px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.04);
        white-space: pre-line;
        font:
          12px/1.6 "IBM Plex Mono",
          monospace;
        color: #bad0ee;
      }
    </style>
  </head>
  <body>
    <div class="preview-shell">
      <h1>multiSelect SegmentedButtons</h1>
      <div id="demo"></div>
      <div class="preview-log" id="log">
        Click any segment to toggle it on or off.
      </div>
    </div>
    <script>
      (async () => {
        await loadComponentAssets(
          "demo",
          "../views/01_refined.html",
          "../styles/01_refined.css",
        );
        const root = document.querySelector("#demo .segmented-button-multi");
        const list = root.querySelector(".segmented-button-multi__list");
        const log = document.getElementById("log");
        const items = [
          ["sms", "sms", "SMS", true],
          ["push", "notifications", "Push", false],
          ["mail", "mail", "Mail", true],
        ];
        list.innerHTML = items
          .map(
            ([id, icon, label, selected]) =>
              `<button class="segmented-button-multi__item" type="button" data-action-id="${id}" data-selected="${selected}" aria-pressed="${selected}"><span class="segmented-button-multi__icon material-symbols-outlined">${icon}</span><span class="segmented-button-multi__label">${label}</span></button>`,
          )
          .join("");
        const sync = () => {
          const selected = [
            ...list.querySelectorAll(
              '.segmented-button-multi__item[data-selected="true"]',
            ),
          ].map((item) => item.dataset.actionId);
          root.dataset.selectedCount = String(selected.length);
          log.textContent = `event: @segmentMultiSelected\nselectedIds: ${selected.join(", ") || "(none)"}`;
        };
        sync();
        root.addEventListener("click", (event) => {
          const item = event.target.closest(".segmented-button-multi__item");
          if (!item) return;
          const next = item.dataset.selected !== "true";
          item.dataset.selected = next ? "true" : "false";
          item.setAttribute("aria-pressed", next ? "true" : "false");
          sync();
        });
      })();
    </script>
  </body>
</html>
