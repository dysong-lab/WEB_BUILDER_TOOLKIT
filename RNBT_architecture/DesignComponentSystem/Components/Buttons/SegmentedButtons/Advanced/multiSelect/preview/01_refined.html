<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><title>SegmentedButtons/Advanced/multiSelect — 01_refined</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/><script src="../../../../../../preview_runtime.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#09111b;color:#eaf2ff;font-family:"Pretendard",sans-serif;padding:36px}</style></head><body><div id="demo"></div><script>(async()=>{await loadComponentAssets("demo","../views/01_refined.html","../styles/01_refined.css");const root=document.querySelector("#demo .segmented-button-multi");const list=root.querySelector(".segmented-button-multi__list");const items=[["sms","sms","SMS",true],["push","notifications","Push",false],["mail","mail","Mail",true]];list.innerHTML=items.map(([id,icon,label,selected])=>`<button class="segmented-button-multi__item" data-action-id="${id}" data-selected="${selected}" aria-pressed="${selected}"><span class="segmented-button-multi__icon material-symbols-outlined">${icon}</span><span class="segmented-button-multi__label">${label}</span></button>`).join("")})();</script></body></html>
