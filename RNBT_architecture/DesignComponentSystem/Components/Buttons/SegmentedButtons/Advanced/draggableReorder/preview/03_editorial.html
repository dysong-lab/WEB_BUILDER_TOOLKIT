<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><title>SegmentedButtons/Advanced/draggableReorder — 03_editorial</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/><script src="../../../../../../preview_runtime.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f6efe4;color:#4a3b2c;font-family:Georgia,serif;padding:36px}</style></head><body><div id="demo"></div><script>(async()=>{await loadComponentAssets("demo","../views/03_editorial.html","../styles/03_editorial.css");const root=document.querySelector("#demo .segmented-button-reorder__list");const items=[["column","view_column","Column"],["essay","article","Essay"],["review","rate_review","Review"]];root.innerHTML=items.map(([id,icon,label])=>`<button class="segmented-button-reorder__item" draggable="true" data-action-id="${id}"><span class="segmented-button-reorder__handle material-symbols-outlined">drag_indicator</span><span class="segmented-button-reorder__icon material-symbols-outlined">${icon}</span><span class="segmented-button-reorder__label">${label}</span></button>`).join("")})();</script></body></html>
