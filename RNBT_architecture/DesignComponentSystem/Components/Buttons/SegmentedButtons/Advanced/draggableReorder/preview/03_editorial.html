<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><title>SegmentedButtons/Advanced/draggableReorder — 03_editorial</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"/><script src="../../../../../../preview_runtime.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#f6efe4;color:#4a3b2c;font-family:Georgia,serif;padding:36px}.preview-shell{max-width:920px;margin:0 auto;display:grid;gap:18px}.preview-log{min-height:112px;padding:16px;border-radius:18px;background:rgba(74,59,44,.06);border:1px solid rgba(74,59,44,.1);white-space:pre-line;font:12px/1.6 "IBM Plex Mono",monospace;color:#75614d}</style></head><body><div class="preview-shell"><h1>draggableReorder SegmentedButtons</h1><div id="demo"></div><div class="preview-log" id="log">Drag editorial lanes into a new reading order.</div></div><script>(async()=>{await loadComponentAssets("demo","../views/03_editorial.html","../styles/03_editorial.css");const list=document.querySelector("#demo .segmented-button-reorder__list");const log=document.getElementById("log");const items=[["column","view_column","Column"],["essay","article","Essay"],["review","rate_review","Review"]];list.innerHTML=items.map(([id,icon,label])=>`<button class="segmented-button-reorder__item" type="button" draggable="true" data-action-id="${id}"><span class="segmented-button-reorder__handle material-symbols-outlined">drag_indicator</span><span class="segmented-button-reorder__icon material-symbols-outlined">${icon}</span><span class="segmented-button-reorder__label">${label}</span></button>`).join("");let draggingId=null;const readOrder=()=>[...list.querySelectorAll(".segmented-button-reorder__item")].map((item)=>item.dataset.actionId);list.addEventListener("click",(event)=>{const item=event.target.closest(".segmented-button-reorder__item");if(!item)return;log.textContent=`event: @segmentClicked\nactionId: ${item.dataset.actionId}`});list.addEventListener("dragstart",(event)=>{const item=event.target.closest(".segmented-button-reorder__item");if(!item)return;draggingId=item.dataset.actionId;if(event.dataTransfer){event.dataTransfer.effectAllowed="move";event.dataTransfer.setData("text/plain",draggingId)}item.dataset.dragState="dragging"});list.addEventListener("dragover",(event)=>{const item=event.target.closest(".segmented-button-reorder__item");if(!item||item.dataset.actionId===draggingId)return;event.preventDefault();list.querySelectorAll(".segmented-button-reorder__item").forEach((node)=>{if(node!==item)delete node.dataset.dragTarget});const rect=item.getBoundingClientRect();item.dataset.dragTarget=event.clientY<rect.top+rect.height/2?"above":"below"});list.addEventListener("dragleave",(event)=>{const item=event.target.closest(".segmented-button-reorder__item");if(item)delete item.dataset.dragTarget});list.addEventListener("drop",(event)=>{event.preventDefault();const item=event.target.closest(".segmented-button-reorder__item");if(!item||!draggingId)return;const dragging=list.querySelector(`[data-action-id="${draggingId}"]`);if(!dragging||dragging===item)return;const position=item.dataset.dragTarget==="above"?"above":"below";if(position==="above")list.insertBefore(dragging,item);else list.insertBefore(dragging,item.nextSibling);log.textContent=`event: @reorderItems\nnewOrder: ${readOrder().join(", ")}`;list.querySelectorAll(".segmented-button-reorder__item").forEach((node)=>{delete node.dataset.dragTarget;delete node.dataset.dragState});draggingId=null});list.addEventListener("dragend",()=>{list.querySelectorAll(".segmented-button-reorder__item").forEach((node)=>{delete node.dataset.dragTarget;delete node.dataset.dragState});draggingId=null})})();</script></body></html>
