<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><title>Dialogs/Advanced/fullscreen — 03_editorial</title><script src="../../../../../preview_runtime.js"></script><script src="../../../../../Mixins/ShadowPopupMixin.js"></script><script src="../../../../../Mixins/FieldRenderMixin.js"></script><script src="../../../../../Mixins/ListRenderMixin.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#f5efe7;color:#382f28;font-family:Georgia,serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:40px}.card{width:min(100%,560px);padding:32px;border:1px solid #e6ddd0;background:#fbf6ef}button.trigger{margin-top:20px;height:46px;padding:0 18px;border:1px solid #4d3e32;background:#4d3e32;color:#fbf6ef;cursor:pointer}</style></head><body><div class="wrap"><div class="card"><h1>Dialogs / fullscreen</h1><p style="margin-top:10px;color:#6a5c52">Editorial fullscreen preview.</p><button class="trigger" type="button">Open Dialog</button><div id="demo"></div></div></div><script>(async()=>{await loadComponentAssets("demo","../views/03_editorial.html","../styles/03_editorial.css");const i={appendElement:document.getElementById("demo"),_popupScope:null};applyShadowPopupMixin(i,{cssSelectors:{template:"#dialog-popup-template"},onCreated:(r)=>{i._popupScope={appendElement:r};applyFieldRenderMixin(i._popupScope,{cssSelectors:{icon:".dialog__icon",headline:".dialog__headline",supporting:".dialog__supporting"}});applyListRenderMixin(i._popupScope,{cssSelectors:{container:".dialog__actions",template:"#dialog-action-template",actionid:".dialog__action",actionLabel:".dialog__action-label"},itemKey:"actionid",datasetAttrs:{actionid:"actionid"}})}});i.sync=()=>{const s=i.shadowPopup.query(".dialog__surface");if(!s)return;const f=window.innerWidth<600;s.dataset.fullscreen=String(f);s.classList.toggle("is-fullscreen",f)};i.open=()=>{i.shadowPopup.show();i._popupScope.fieldRender.renderData({response:{icon:"¶",headline:"Continue long-form review?",supporting:"Fullscreen preserves comfortable margins while keeping the text focus intact."}});i._popupScope.listRender.renderData({response:[{actionid:"later",actionLabel:"Later"},{actionid:"continue",actionLabel:"Continue"}]});i.sync()};i.close=()=>i.shadowPopup.hide();window.addEventListener("resize",i.sync);i.shadowPopup.bindPopupEvents({click:{".dialog__close-btn":()=>i.close(),".dialog__action":()=>i.close()}});document.querySelector(".trigger").addEventListener("click",i.open)})();</script></body></html>
