<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" /><title>Dialogs/Advanced/fullscreen — 01_refined</title><script src="../../../../../preview_runtime.js"></script><script src="../../../../../Mixins/ShadowPopupMixin.js"></script><script src="../../../../../Mixins/FieldRenderMixin.js"></script><script src="../../../../../Mixins/ListRenderMixin.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#0d1022;color:#f6f3ff;font-family:"Pretendard",sans-serif}.preview-shell{min-height:100vh;display:grid;place-items:center;padding:40px}.preview-card{width:min(100%,560px);padding:36px;border:1px solid rgba(167,152,255,.16);border-radius:28px;background:rgba(18,22,48,.84)}.preview-trigger{margin-top:24px;height:48px;padding:0 20px;border:0;border-radius:999px;background:linear-gradient(135deg,#c7b9ff,#8e72ff);color:#130f28;font-weight:700;cursor:pointer}</style></head><body><div class="preview-shell"><div class="preview-card"><h1>Dialogs / fullscreen</h1><p style="margin-top:12px;color:rgba(236,232,255,.78)">viewport 폭에 따라 fullscreen 상태가 바뀌는 대화상자 프리뷰입니다.</p><button type="button" class="preview-trigger">Open Dialog</button><div id="dialogs-fullscreen-container"></div></div></div><script>(async()=>{await loadComponentAssets("dialogs-fullscreen-container","../views/01_refined.html","../styles/01_refined.css");const instance={id:"dialogs-fullscreen",appendElement:document.getElementById("dialogs-fullscreen-container"),_popupScope:null,_isFullscreen:false,_forceFullscreen:null};applyShadowPopupMixin(instance,{cssSelectors:{template:"#dialog-popup-template",surface:".dialog__surface",closeBtn:".dialog__close-btn"},onCreated:(shadowRoot)=>{instance._popupScope={appendElement:shadowRoot};applyFieldRenderMixin(instance._popupScope,{cssSelectors:{icon:".dialog__icon",headline:".dialog__headline",supporting:".dialog__supporting"}});applyListRenderMixin(instance._popupScope,{cssSelectors:{container:".dialog__actions",template:"#dialog-action-template",actionid:".dialog__action",actionLabel:".dialog__action-label"},itemKey:"actionid",datasetAttrs:{actionid:"actionid"}})}});instance.applyState=()=>{const surface=instance.shadowPopup.query(".dialog__surface");if(!surface)return;const full=instance._forceFullscreen??(window.innerWidth<600);surface.dataset.fullscreen=String(full);surface.classList.toggle("is-fullscreen",full);instance._isFullscreen=full};instance.open=()=>{instance.shadowPopup.show();instance._popupScope.fieldRender.renderData({response:{icon:"✦",headline:"Unsaved draft detected",supporting:"Continue editing in fullscreen when the viewport narrows below the breakpoint."}});instance._popupScope.listRender.renderData({response:[{actionid:"dismiss",actionLabel:"Dismiss"},{actionid:"resume",actionLabel:"Resume"}]});instance.applyState()};instance.close=()=>instance.shadowPopup.hide();window.addEventListener("resize",instance.applyState);instance.shadowPopup.bindPopupEvents({click:{".dialog__close-btn":()=>instance.close(),".dialog__action":()=>instance.close()}});document.querySelector(".preview-trigger").addEventListener("click",instance.open)})();</script></body></html>
