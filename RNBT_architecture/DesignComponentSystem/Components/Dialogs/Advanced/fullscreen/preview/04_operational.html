<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><title>Dialogs/Advanced/fullscreen — 04_operational</title><script src="../../../../../preview_runtime.js"></script><script src="../../../../../Mixins/ShadowPopupMixin.js"></script><script src="../../../../../Mixins/FieldRenderMixin.js"></script><script src="../../../../../Mixins/ListRenderMixin.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#041116;color:#d8fbff;font-family:"JetBrains Mono",monospace}.wrap{min-height:100vh;display:grid;place-items:center;padding:40px}.card{width:min(100%,560px);padding:32px;border:1px solid rgba(0,188,212,.2);background:#08151a}button.trigger{margin-top:20px;height:46px;padding:0 18px;border:0;background:#00bcd4;color:#02161a;cursor:pointer}</style></head><body><div class="wrap"><div class="card"><h1>Dialogs / fullscreen</h1><p style="margin-top:10px;color:#89c8d0">OPS fullscreen preview.</p><button class="trigger" type="button">Open Dialog</button><div id="demo"></div></div></div><script>(async()=>{await loadComponentAssets("demo","../views/04_operational.html","../styles/04_operational.css");const i={appendElement:document.getElementById("demo"),_popupScope:null,_forceFullscreen:true};applyShadowPopupMixin(i,{cssSelectors:{template:"#dialog-popup-template"},onCreated:(r)=>{i._popupScope={appendElement:r};applyFieldRenderMixin(i._popupScope,{cssSelectors:{icon:".dialog__icon",headline:".dialog__headline",supporting:".dialog__supporting"}});applyListRenderMixin(i._popupScope,{cssSelectors:{container:".dialog__actions",template:"#dialog-action-template",actionid:".dialog__action",actionLabel:".dialog__action-label"},itemKey:"actionid",datasetAttrs:{actionid:"actionid"}})}});i.sync=()=>{const s=i.shadowPopup.query(".dialog__surface");if(!s)return;s.dataset.fullscreen="true";s.classList.add("is-fullscreen")};i.open=()=>{i.shadowPopup.show();i._popupScope.fieldRender.renderData({response:{icon:"■",headline:"Apply maintenance mode?",supporting:"Operational mode can force fullscreen regardless of breakpoint."}});i._popupScope.listRender.renderData({response:[{actionid:"abort",actionLabel:"Abort"},{actionid:"apply",actionLabel:"Apply"}]});i.sync()};i.close=()=>i.shadowPopup.hide();i.shadowPopup.bindPopupEvents({click:{".dialog__close-btn":()=>i.close(),".dialog__action":()=>i.close()}});document.querySelector(".trigger").addEventListener("click",i.open)})();</script></body></html>
