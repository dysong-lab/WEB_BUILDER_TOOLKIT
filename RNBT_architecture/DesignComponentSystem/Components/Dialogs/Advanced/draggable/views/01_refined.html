<div class="dialogs dialogs--draggable-refined">
  <template id="dialog-popup-template">
    <style>@import url("../styles/01_refined.css");</style>
    <div class="dialog__overlay">
      <div class="dialog__surface" data-dragging="false" role="dialog" aria-modal="true">
        <div class="dialog__handle">
          <div class="dialog__grip"></div>
          <button type="button" class="dialog__close-btn" aria-label="Close dialog">×</button>
        </div>
        <div class="dialog__content">
          <div class="dialog__icon"></div>
          <h2 class="dialog__headline">Dialog headline</h2>
          <p class="dialog__supporting">Dialog supporting copy.</p>
        </div>
        <div class="dialog__actions"></div>
      </div>
    </div>
    <template id="dialog-action-template"><button type="button" class="dialog__action" data-actionid=""><span class="dialog__action-label"></span></button></template>
  </template>
</div>
