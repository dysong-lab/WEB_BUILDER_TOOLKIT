<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><title>Dialogs/Advanced/draggable — 02_material</title><script src="../../../../../preview_runtime.js"></script><script src="../../../../../Mixins/ShadowPopupMixin.js"></script><script src="../../../../../Mixins/FieldRenderMixin.js"></script><script src="../../../../../Mixins/ListRenderMixin.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#f1edf4;color:#1c1b1f;font-family:Roboto,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:40px}.card{width:min(100%,560px);padding:32px;border-radius:24px;background:#fff;box-shadow:0 20px 48px rgba(0,0,0,.12)}button.trigger{margin-top:20px;height:46px;padding:0 18px;border:0;border-radius:999px;background:#6750a4;color:#fff;cursor:pointer}</style></head><body><div class="wrap"><div class="card"><h1>Dialogs / draggable</h1><button class="trigger" type="button">Open Dialog</button><div id="demo"></div></div></div><script>(async()=>{await loadComponentAssets("demo","../views/02_material.html","../styles/02_material.css");const i={appendElement:document.getElementById("demo"),_popupScope:null};applyShadowPopupMixin(i,{cssSelectors:{template:"#dialog-popup-template"},onCreated:(r)=>{i._popupScope={appendElement:r};applyFieldRenderMixin(i._popupScope,{cssSelectors:{icon:".dialog__icon",headline:".dialog__headline",supporting:".dialog__supporting"}});applyListRenderMixin(i._popupScope,{cssSelectors:{container:".dialog__actions",template:"#dialog-action-template",actionid:".dialog__action",actionLabel:".dialog__action-label"},itemKey:"actionid",datasetAttrs:{actionid:"actionid"}});let x=0,y=0,sx=0,sy=0,ox=0,oy=0,down=false;const h=r.querySelector(".dialog__handle"),s=r.querySelector(".dialog__surface"),a=()=>s.style.transform=`translate3d(${x}px,${y}px,0)`;h.addEventListener("pointerdown",(e)=>{down=true;sx=e.clientX;sy=e.clientY;ox=x;oy=y;h.setPointerCapture(e.pointerId)});h.addEventListener("pointermove",(e)=>{if(!down)return;x=ox+(e.clientX-sx);y=oy+(e.clientY-sy);s.dataset.dragging="true";a()});const up=(e)=>{down=false;s.dataset.dragging="false";try{h.releasePointerCapture(e.pointerId)}catch(_){}};h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up)}});i.open=()=>{i.shadowPopup.show();i._popupScope.fieldRender.renderData({response:{icon:"◌",headline:"Move this settings dialog",supporting:"Drag behavior mirrors desktop modal repositioning."}});i._popupScope.listRender.renderData({response:[{actionid:"cancel",actionLabel:"Cancel"},{actionid:"save",actionLabel:"Save"}]})};i.close=()=>i.shadowPopup.hide();i.shadowPopup.bindPopupEvents({click:{".dialog__close-btn":()=>i.close(),".dialog__action":()=>i.close()}});document.querySelector(".trigger").addEventListener("click",i.open)})();</script></body></html>
