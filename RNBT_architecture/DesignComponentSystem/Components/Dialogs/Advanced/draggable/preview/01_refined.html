<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><title>Dialogs/Advanced/draggable — 01_refined</title><script src="../../../../../preview_runtime.js"></script><script src="../../../../../Mixins/ShadowPopupMixin.js"></script><script src="../../../../../Mixins/FieldRenderMixin.js"></script><script src="../../../../../Mixins/ListRenderMixin.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#0d1022;color:#f6f3ff;font-family:"Pretendard",sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:40px}.card{width:min(100%,560px);padding:36px;border:1px solid rgba(167,152,255,.16);border-radius:28px;background:rgba(18,22,48,.84)}button.trigger{margin-top:24px;height:48px;padding:0 20px;border:0;border-radius:999px;background:linear-gradient(135deg,#c7b9ff,#8e72ff);color:#130f28;font-weight:700;cursor:pointer}</style></head><body><div class="wrap"><div class="card"><h1>Dialogs / draggable</h1><p style="margin-top:12px;color:rgba(236,232,255,.78)">헤더를 드래그해서 위치를 이동하는 프리뷰입니다.</p><button class="trigger" type="button">Open Dialog</button><div id="demo"></div></div></div><script>(async()=>{await loadComponentAssets("demo","../views/01_refined.html","../styles/01_refined.css");const i={appendElement:document.getElementById("demo"),_popupScope:null,x:0,y:0,sx:0,sy:0,ox:0,oy:0,down:false};applyShadowPopupMixin(i,{cssSelectors:{template:"#dialog-popup-template"},onCreated:(r)=>{i._popupScope={appendElement:r};applyFieldRenderMixin(i._popupScope,{cssSelectors:{icon:".dialog__icon",headline:".dialog__headline",supporting:".dialog__supporting"}});applyListRenderMixin(i._popupScope,{cssSelectors:{container:".dialog__actions",template:"#dialog-action-template",actionid:".dialog__action",actionLabel:".dialog__action-label"},itemKey:"actionid",datasetAttrs:{actionid:"actionid"}});const handle=r.querySelector(".dialog__handle");const surface=r.querySelector(".dialog__surface");const apply=()=>surface.style.transform=`translate3d(${i.x}px,${i.y}px,0)`;handle.addEventListener("pointerdown",(e)=>{i.down=true;i.sx=e.clientX;i.sy=e.clientY;i.ox=i.x;i.oy=i.y;handle.setPointerCapture(e.pointerId)});handle.addEventListener("pointermove",(e)=>{if(!i.down)return;i.x=i.ox+(e.clientX-i.sx);i.y=i.oy+(e.clientY-i.sy);surface.dataset.dragging="true";apply()});const up=(e)=>{i.down=false;surface.dataset.dragging="false";try{handle.releasePointerCapture(e.pointerId)}catch(_){}};handle.addEventListener("pointerup",up);handle.addEventListener("pointercancel",up)}});i.open=()=>{i.shadowPopup.show();i._popupScope.fieldRender.renderData({response:{icon:"↕",headline:"Reposition comparison panel",supporting:"Drag the header to move the dialog while reviewing adjacent content."}});i._popupScope.listRender.renderData({response:[{actionid:"dismiss",actionLabel:"Dismiss"},{actionid:"pin",actionLabel:"Pin"}]})};i.close=()=>i.shadowPopup.hide();i.shadowPopup.bindPopupEvents({click:{".dialog__close-btn":()=>i.close(),".dialog__action":()=>i.close()}});document.querySelector(".trigger").addEventListener("click",i.open)})();</script></body></html>
