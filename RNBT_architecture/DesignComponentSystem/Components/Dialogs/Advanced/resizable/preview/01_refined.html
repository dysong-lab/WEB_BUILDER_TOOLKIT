<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><title>Dialogs/Advanced/resizable — 01_refined</title><script src="../../../../../preview_runtime.js"></script><script src="../../../../../Mixins/ShadowPopupMixin.js"></script><script src="../../../../../Mixins/FieldRenderMixin.js"></script><script src="../../../../../Mixins/ListRenderMixin.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#0d1022;color:#f6f3ff;font-family:"Pretendard",sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:40px}.card{width:min(100%,560px);padding:36px;border:1px solid rgba(167,152,255,.16);border-radius:28px;background:rgba(18,22,48,.84)}button.trigger{margin-top:24px;height:48px;padding:0 20px;border:0;border-radius:999px;background:linear-gradient(135deg,#c7b9ff,#8e72ff);color:#130f28;font-weight:700;cursor:pointer}</style></head><body><div class="wrap"><div class="card"><h1>Dialogs / resizable</h1><p style="margin-top:12px;color:rgba(236,232,255,.78)">우측/하단/우하단 핸들로 크기를 바꾸는 프리뷰입니다.</p><button class="trigger" type="button">Open Dialog</button><div id="demo"></div></div></div><script>(async()=>{await loadComponentAssets("demo","../views/01_refined.html","../styles/01_refined.css");const i={appendElement:document.getElementById("demo"),_popupScope:null};applyShadowPopupMixin(i,{cssSelectors:{template:"#dialog-popup-template"},onCreated:(r)=>{i._popupScope={appendElement:r};applyFieldRenderMixin(i._popupScope,{cssSelectors:{icon:".dialog__icon",headline:".dialog__headline",supporting:".dialog__supporting"}});applyListRenderMixin(i._popupScope,{cssSelectors:{container:".dialog__actions",template:"#dialog-action-template",actionid:".dialog__action",actionLabel:".dialog__action-label"},itemKey:"actionid",datasetAttrs:{actionid:"actionid"}});const s=r.querySelector(".dialog__surface");r.querySelectorAll(".dialog__resize-handle").forEach((h)=>{let down=false,sx=0,sy=0,ow=0,oh=0;h.addEventListener("pointerdown",(e)=>{down=true;sx=e.clientX;sy=e.clientY;ow=s.offsetWidth;oh=s.offsetHeight;h.setPointerCapture(e.pointerId);s.dataset.resizing="true"});h.addEventListener("pointermove",(e)=>{if(!down)return;const dir=h.dataset.direction;const w=ow+((dir==="e"||dir==="se")?(e.clientX-sx):0);const hh=oh+((dir==="s"||dir==="se")?(e.clientY-sy):0);s.style.width=Math.max(320,w)+"px";s.style.height=Math.max(200,hh)+"px"});const up=(e)=>{down=false;s.dataset.resizing="false";try{h.releasePointerCapture(e.pointerId)}catch(_){}};h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up)})}});i.open=()=>{i.shadowPopup.show();i._popupScope.fieldRender.renderData({response:{icon:"▣",headline:"Resize comparison workspace",supporting:"Adjust the dialog footprint to fit long review notes or dense tables."}});i._popupScope.listRender.renderData({response:[{actionid:"cancel",actionLabel:"Cancel"},{actionid:"apply",actionLabel:"Apply"}]})};i.close=()=>i.shadowPopup.hide();i.shadowPopup.bindPopupEvents({click:{".dialog__close-btn":()=>i.close(),".dialog__action":()=>i.close()}});document.querySelector(".trigger").addEventListener("click",i.open)})();</script></body></html>
