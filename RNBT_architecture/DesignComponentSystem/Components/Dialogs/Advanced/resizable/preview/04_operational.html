<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><title>Dialogs/Advanced/resizable — 04_operational</title><script src="../../../../../preview_runtime.js"></script><script src="../../../../../Mixins/ShadowPopupMixin.js"></script><script src="../../../../../Mixins/FieldRenderMixin.js"></script><script src="../../../../../Mixins/ListRenderMixin.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:#041116;color:#d8fbff;font-family:"JetBrains Mono",monospace}.wrap{min-height:100vh;display:grid;place-items:center;padding:40px}.card{width:min(100%,560px);padding:32px;border:1px solid rgba(0,188,212,.2);background:#08151a}button.trigger{margin-top:20px;height:46px;padding:0 18px;border:0;background:#00bcd4;color:#02161a;cursor:pointer}</style></head><body><div class="wrap"><div class="card"><h1>Dialogs / resizable</h1><button class="trigger" type="button">Open Dialog</button><div id="demo"></div></div></div><script>(async()=>{await loadComponentAssets("demo","../views/04_operational.html","../styles/04_operational.css");const i={appendElement:document.getElementById("demo"),_popupScope:null};applyShadowPopupMixin(i,{cssSelectors:{template:"#dialog-popup-template"},onCreated:(r)=>{i._popupScope={appendElement:r};applyFieldRenderMixin(i._popupScope,{cssSelectors:{icon:".dialog__icon",headline:".dialog__headline",supporting:".dialog__supporting"}});applyListRenderMixin(i._popupScope,{cssSelectors:{container:".dialog__actions",template:"#dialog-action-template",actionid:".dialog__action",actionLabel:".dialog__action-label"},itemKey:"actionid",datasetAttrs:{actionid:"actionid"}});const s=r.querySelector(".dialog__surface");r.querySelectorAll(".dialog__resize-handle").forEach((h)=>{let d=false,sx=0,sy=0,ow=0,oh=0;h.addEventListener("pointerdown",(e)=>{d=true;sx=e.clientX;sy=e.clientY;ow=s.offsetWidth;oh=s.offsetHeight;h.setPointerCapture(e.pointerId);s.dataset.resizing="true"});h.addEventListener("pointermove",(e)=>{if(!d)return;const dir=h.dataset.direction;s.style.width=Math.max(320,ow+((dir==="e"||dir==="se")?(e.clientX-sx):0))+"px";s.style.height=Math.max(200,oh+((dir==="s"||dir==="se")?(e.clientY-sy):0))+"px"});const up=(e)=>{d=false;s.dataset.resizing="false";try{h.releasePointerCapture(e.pointerId)}catch(_){}};h.addEventListener("pointerup",up);h.addEventListener("pointercancel",up)})}});i.open=()=>{i.shadowPopup.show();i._popupScope.fieldRender.renderData({response:{icon:"▣",headline:"Resize operational console",supporting:"Widen the panel to inspect more telemetry columns at once."}});i._popupScope.listRender.renderData({response:[{actionid:"hold",actionLabel:"Hold"},{actionid:"apply",actionLabel:"Apply"}]})};i.close=()=>i.shadowPopup.hide();i.shadowPopup.bindPopupEvents({click:{".dialog__close-btn":()=>i.close(),".dialog__action":()=>i.close()}});document.querySelector(".trigger").addEventListener("click",i.open)})();</script></body></html>
