<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/selectable - 02_material</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#eef2ff}#app{width:392px;margin:0 auto}</style></head><body><div id="app"></div><script src="../../../../../../preview_runtime.js"></script><script src="../../../../../../Mixins/ListRenderMixin.js"></script><script>(async()=>{await loadComponentAssets('app','../views/02_material.html','../styles/02_material.css');const instance={id:'card-selectable',appendElement:document.getElementById('app')};applyListRenderMixin(instance,{cssSelectors:{container:'.card-selectable__list',template:'#card-selectable-item-template',item:'.card-selectable__item',actionId:'.card-selectable__item',icon:'.card-selectable__icon',title:'.card-selectable__title',summary:'.card-selectable__summary'},datasetAttrs:{actionId:'action-id'},itemKey:'actionId'});const selected=new Set(['task-2']);const sync=()=>instance.appendElement.querySelectorAll('.card-selectable__item').forEach(el=>{const on=selected.has(el.dataset.actionId);el.dataset.selected=String(on);el.setAttribute('aria-selected',String(on));});instance.listRender.renderData({response:[{actionId:'task-1',icon:'task_alt',title:'Inbox',summary:'6 tasks need confirmation'},{actionId:'task-2',icon:'bolt',title:'Today',summary:'4 tasks blocked by review'},{actionId:'task-3',icon:'calendar_month',title:'Upcoming',summary:'Next milestone in 3 days'}]});sync();instance.appendElement.querySelector('.card-selectable__list').addEventListener('click',e=>{const item=e.target.closest('.card-selectable__item');if(!item)return;selected.has(item.dataset.actionId)?selected.delete(item.dataset.actionId):selected.add(item.dataset.actionId);sync();});})();</script></body></html>
