<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/selectable - 02_material</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#eef2ff;font-family:Roboto,sans-serif}.card-selectable__list{width:392px;margin:0 auto;display:flex;flex-direction:column;gap:12px}.card-selectable__item{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:20px;background:#fff;color:#21304e;box-shadow:0 8px 24px rgba(69,90,166,.12);cursor:pointer}.card-selectable__check{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;background:#eef2ff;color:transparent}.card-selectable__icon{font-size:24px;color:#4763b8}.card-selectable__title{font:500 18px/1.2 Roboto,sans-serif}.card-selectable__summary{margin-top:6px;font:400 13px/1.6 Roboto,sans-serif;color:#60708f}.card-selectable__item[data-selected="true"]{background:#e8edff;box-shadow:0 12px 28px rgba(69,90,166,.18)}.card-selectable__item[data-selected="true"] .card-selectable__check{background:#4763b8;color:#fff}</style></head><body><section class="card-selectable"><div class="card-selectable__list"><article class="card-selectable__item" data-selected="false"><div class="card-selectable__check"><span class="material-symbols-outlined">done</span></div><span class="material-symbols-outlined card-selectable__icon">task_alt</span><div><h3 class="card-selectable__title">Inbox</h3><p class="card-selectable__summary">6 tasks need confirmation</p></div></article><article class="card-selectable__item" data-selected="true"><div class="card-selectable__check"><span class="material-symbols-outlined">done</span></div><span class="material-symbols-outlined card-selectable__icon">bolt</span><div><h3 class="card-selectable__title">Today</h3><p class="card-selectable__summary">4 tasks blocked by review</p></div></article><article class="card-selectable__item" data-selected="false"><div class="card-selectable__check"><span class="material-symbols-outlined">done</span></div><span class="material-symbols-outlined card-selectable__icon">calendar_month</span><div><h3 class="card-selectable__title">Upcoming</h3><p class="card-selectable__summary">Next milestone in 3 days</p></div></article></div></section><script>document.querySelectorAll('.card-selectable__item').forEach(el=>el.addEventListener('click',()=>el.dataset.selected=String(el.dataset.selected!=='true')));</script></body></html>
