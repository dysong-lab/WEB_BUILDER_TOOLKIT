<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/selectable - 04_operational</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#071114}.card-selectable__list{width:392px;margin:0 auto;display:flex;flex-direction:column;gap:10px}.card-selectable__item{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:12px;border:1px solid #184f57;background:#071317;color:#d7ffff;cursor:pointer}.card-selectable__check{display:grid;place-items:center;width:22px;height:22px;border-radius:6px;border:1px solid #246a74;color:transparent}.card-selectable__icon{font-size:22px;color:#67f2ff}.card-selectable__title{font:700 16px/1.2 "JetBrains Mono",monospace}.card-selectable__summary{margin-top:6px;font:400 12px/1.6 "JetBrains Mono",monospace;color:#8eb8bc}.card-selectable__item[data-selected="true"]{border-color:#00e5ff;box-shadow:0 0 0 2px rgba(0,229,255,.25)}.card-selectable__item[data-selected="true"] .card-selectable__check{background:#00e5ff;color:#041114}</style></head><body><section class="card-selectable"><div class="card-selectable__list"><article class="card-selectable__item" data-selected="false"><div class="card-selectable__check"><span class="material-symbols-outlined">done</span></div><span class="material-symbols-outlined card-selectable__icon">thermostat</span><div><h3 class="card-selectable__title">SENSOR-01</h3><p class="card-selectable__summary">Inlet temp stable</p></div></article><article class="card-selectable__item" data-selected="true"><div class="card-selectable__check"><span class="material-symbols-outlined">done</span></div><span class="material-symbols-outlined card-selectable__icon">airwave</span><div><h3 class="card-selectable__title">SENSOR-02</h3><p class="card-selectable__summary">Humidity trend elevated</p></div></article><article class="card-selectable__item" data-selected="false"><div class="card-selectable__check"><span class="material-symbols-outlined">done</span></div><span class="material-symbols-outlined card-selectable__icon">bolt</span><div><h3 class="card-selectable__title">MOTOR-03</h3><p class="card-selectable__summary">Power draw nominal</p></div></article></div></section><script>document.querySelectorAll('.card-selectable__item').forEach(el=>el.addEventListener('click',()=>el.dataset.selected=String(el.dataset.selected!=='true')));</script></body></html>
