<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/selectable - 04_operational</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#071114}#app{width:392px;margin:0 auto}</style></head><body><div id="app"></div><script src="../../../../../../preview_runtime.js"></script><script src="../../../../../../Mixins/ListRenderMixin.js"></script><script>(async()=>{await loadComponentAssets('app','../views/04_operational.html','../styles/04_operational.css');const instance={id:'card-selectable',appendElement:document.getElementById('app')};applyListRenderMixin(instance,{cssSelectors:{group:'.card-selectable',container:'.card-selectable__list',template:'#card-selectable-item-template',item:'.card-selectable__item',actionId:'.card-selectable__item',icon:'.card-selectable__icon',title:'.card-selectable__title',summary:'.card-selectable__summary'},datasetAttrs:{actionId:'action-id'},itemKey:'actionId'});const selected=new Set(['sensor-2','sensor-4']);const sync=()=>{instance.appendElement.querySelectorAll('.card-selectable__item').forEach(el=>{const on=selected.has(el.dataset.actionId);el.dataset.selected=String(on);el.setAttribute('aria-selected',String(on));});instance.appendElement.querySelector('.card-selectable').dataset.selectedCount=String(selected.size)};instance.listRender.renderData({response:[{actionId:'sensor-1',icon:'thermometer',title:'SENSOR-01',summary:'Inlet temp stable'},{actionId:'sensor-2',icon:'airwave',title:'SENSOR-02',summary:'Humidity trend elevated'},{actionId:'sensor-3',icon:'bolt',title:'MOTOR-03',summary:'Power draw nominal'},{actionId:'sensor-4',icon:'valve',title:'VALVE-04',summary:'Manual lock enabled'}]});sync();instance.appendElement.querySelector('.card-selectable__list').addEventListener('click',e=>{const item=e.target.closest('.card-selectable__item');if(!item)return;selected.has(item.dataset.actionId)?selected.delete(item.dataset.actionId):selected.add(item.dataset.actionId);sync();});})();</script></body></html>
