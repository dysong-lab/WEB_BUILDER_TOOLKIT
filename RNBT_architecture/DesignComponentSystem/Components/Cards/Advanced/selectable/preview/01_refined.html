<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/selectable - 01_refined</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#0d1427;color:#dce4ff}#app{width:392px;margin:0 auto}.log{margin-top:16px;font:12px/1.6 monospace;color:#9fb0e8}</style></head><body><div id="app"></div><div class="log" id="log"></div><script src="../../../../../../preview_runtime.js"></script><script src="../../../../../../Mixins/ListRenderMixin.js"></script><script>(async()=>{await loadComponentAssets('app','../views/01_refined.html','../styles/01_refined.css');const instance={id:'card-selectable',appendElement:document.getElementById('app')};applyListRenderMixin(instance,{cssSelectors:{group:'.card-selectable',container:'.card-selectable__list',template:'#card-selectable-item-template',item:'.card-selectable__item',actionId:'.card-selectable__item',icon:'.card-selectable__icon',title:'.card-selectable__title',summary:'.card-selectable__summary'},datasetAttrs:{actionId:'action-id'},itemKey:'actionId'});instance._selectedIds=new Set();instance._applySelection=()=>{instance.appendElement.querySelectorAll('.card-selectable__item').forEach(el=>{const selected=instance._selectedIds.has(el.dataset.actionId);el.dataset.selected=String(selected);el.setAttribute('aria-selected',String(selected));});instance.appendElement.querySelector('.card-selectable').dataset.selectedCount=String(instance._selectedIds.size)};instance._setSelected=(id)=>{instance._selectedIds.has(id)?instance._selectedIds.delete(id):instance._selectedIds.add(id);instance._applySelection();Weventbus.emit('@cardSelected',{targetInstance:instance,selectedIds:[...instance._selectedIds],changedId:id,changedTo:instance._selectedIds.has(id)?'on':'off'});};instance.listRender.renderData({response:[{actionId:'doc-1',icon:'description',title:'Q4 Report.pdf',summary:'12.4MB · Updated 2m ago'},{actionId:'doc-2',icon:'image',title:'Logo Final.png',summary:'2.1MB · Synced 8m ago'},{actionId:'doc-3',icon:'movie',title:'Demo Reel.mp4',summary:'85MB · Review pending'}]});instance._applySelection();instance.appendElement.querySelector('.card-selectable__list').addEventListener('click',e=>{const item=e.target.closest('.card-selectable__item');if(item)instance._setSelected(item.dataset.actionId)});Weventbus.on('@cardSelected',({selectedIds})=>document.getElementById('log').textContent='selectedIds: '+selectedIds.join(', '));})();</script></body></html>
