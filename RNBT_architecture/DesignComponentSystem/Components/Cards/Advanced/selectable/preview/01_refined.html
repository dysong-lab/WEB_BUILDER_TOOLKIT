<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/selectable - 01_refined</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#0d1427;color:#dce4ff;font-family:Pretendard,sans-serif}#app{width:392px;margin:0 auto}.log{margin-top:16px;font:12px/1.6 monospace;color:#9fb0e8}.card-selectable__list{display:flex;flex-direction:column;gap:12px}.card-selectable__item{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:22px;background:linear-gradient(180deg,#111b36,#0b1225);color:#e8f2ff;box-shadow:0 18px 34px rgba(7,11,25,.26);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}.card-selectable__check{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;background:rgba(255,255,255,.08);color:transparent;flex-shrink:0}.card-selectable__icon{font-size:24px;color:#95aafc}.card-selectable__title{font:700 18px/1.2 Pretendard,sans-serif}.card-selectable__summary{margin-top:6px;font:400 13px/1.6 Pretendard,sans-serif;color:#b6c4ec}.card-selectable__item[data-selected="true"]{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(158,118,255,.6),0 20px 44px rgba(90,54,189,.25)}.card-selectable__item[data-selected="true"] .card-selectable__check{background:#875fff;color:#fff}</style></head><body><div id="app"><section class="card-selectable"><div class="card-selectable__list"><article class="card-selectable__item" data-selected="false"><div class="card-selectable__check"><span class="material-symbols-outlined">done</span></div><span class="material-symbols-outlined card-selectable__icon">description</span><div><h3 class="card-selectable__title">Q4 Report.pdf</h3><p class="card-selectable__summary">12.4MB · Updated 2m ago</p></div></article><article class="card-selectable__item" data-selected="false"><div class="card-selectable__check"><span class="material-symbols-outlined">done</span></div><span class="material-symbols-outlined card-selectable__icon">image</span><div><h3 class="card-selectable__title">Logo Final.png</h3><p class="card-selectable__summary">2.1MB · Synced 8m ago</p></div></article><article class="card-selectable__item" data-selected="false"><div class="card-selectable__check"><span class="material-symbols-outlined">done</span></div><span class="material-symbols-outlined card-selectable__icon">movie</span><div><h3 class="card-selectable__title">Demo Reel.mp4</h3><p class="card-selectable__summary">85MB · Review pending</p></div></article></div></section></div><div class="log" id="log"></div><script>document.querySelectorAll('.card-selectable__item').forEach(el=>el.addEventListener('click',()=>{el.dataset.selected=String(el.dataset.selected!=='true');document.getElementById('log').textContent='selected: '+[...document.querySelectorAll('.card-selectable__item[data-selected=\"true\"] .card-selectable__title')].map(n=>n.textContent).join(', ')}));</script></body></html>
