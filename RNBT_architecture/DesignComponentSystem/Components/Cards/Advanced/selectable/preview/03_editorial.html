<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/selectable - 03_editorial</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#f4efe8}.card-selectable__list{width:392px;margin:0 auto;display:flex;flex-direction:column;gap:12px}.card-selectable__item{display:flex;gap:14px;align-items:flex-start;padding:18px;border-radius:18px;border:1px solid #d7cab9;background:#faf5ee;color:#30251b;cursor:pointer}.card-selectable__check{display:grid;place-items:center;width:24px;height:24px;border-radius:999px;border:1px solid #cbbba7;color:transparent}.card-selectable__icon{font-size:24px;color:#8b7258}.card-selectable__title{font:700 19px/1.15 Georgia,serif}.card-selectable__summary{margin-top:6px;font:400 14px/1.7 Georgia,serif;color:#695442}.card-selectable__item[data-selected="true"]{background:#f1e7d7;border-color:#6c543d}.card-selectable__item[data-selected="true"] .card-selectable__check{background:#6c543d;color:#fff}</style></head><body><section class="card-selectable"><div class="card-selectable__list"><article class="card-selectable__item" data-selected="false"><div class="card-selectable__check"><span class="material-symbols-outlined">done</span></div><span class="material-symbols-outlined card-selectable__icon">article</span><div><h3 class="card-selectable__title">Morning Notes</h3><p class="card-selectable__summary">A short column on attention and pace.</p></div></article><article class="card-selectable__item" data-selected="false"><div class="card-selectable__check"><span class="material-symbols-outlined">done</span></div><span class="material-symbols-outlined card-selectable__icon">bookmark</span><div><h3 class="card-selectable__title">Marked Passages</h3><p class="card-selectable__summary">Collected excerpts for later review.</p></div></article><article class="card-selectable__item" data-selected="false"><div class="card-selectable__check"><span class="material-symbols-outlined">done</span></div><span class="material-symbols-outlined card-selectable__icon">library_books</span><div><h3 class="card-selectable__title">Archive Picks</h3><p class="card-selectable__summary">Long-form pieces worth returning to.</p></div></article></div></section><script>document.querySelectorAll('.card-selectable__item').forEach(el=>el.addEventListener('click',()=>el.dataset.selected=String(el.dataset.selected!=='true')));</script></body></html>
