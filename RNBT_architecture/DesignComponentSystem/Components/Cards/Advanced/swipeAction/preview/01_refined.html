<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/swipeAction - 01_refined</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#0d1427;font-family:Pretendard,sans-serif}.card-swipe{position:relative;width:360px;height:140px;margin:0 auto;overflow:hidden;border-radius:24px;background:#0d1427}.card-swipe__actions{position:absolute;inset:0;display:flex;align-items:center;padding:0 18px}.card-swipe__actions--left{justify-content:flex-start;background:#332887}.card-swipe__actions--right{justify-content:flex-end;background:#4b234b}.card-swipe__action{padding:10px 16px;border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font:600 13px/1 Pretendard,sans-serif}.card-swipe__face{position:absolute;inset:0;display:flex;gap:14px;align-items:center;padding:22px;background:linear-gradient(180deg,#111b36,#0b1225);color:#e8f2ff}.card-swipe__icon{font-size:28px;color:#8fa5ff}.card-swipe__title{font:700 24px/1.1 Pretendard,sans-serif}.card-swipe__summary{margin-top:6px;font:400 14px/1.6 Pretendard,sans-serif;color:#b6c4ec}</style></head><body><article class="card-swipe"><div class="card-swipe__actions card-swipe__actions--left"><button class="card-swipe__action" type="button">Pin</button></div><div class="card-swipe__actions card-swipe__actions--right"><button class="card-swipe__action" type="button">Archive</button></div><div class="card-swipe__face"><span class="material-symbols-outlined card-swipe__icon">memory</span><div><h3 class="card-swipe__title">Rack Thermal Drift</h3><p class="card-swipe__summary">Swipe to pin or archive this signal.</p></div></div></article></body></html>
