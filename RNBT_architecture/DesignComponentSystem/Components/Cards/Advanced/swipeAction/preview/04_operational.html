<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Cards/Advanced/swipeAction - 04_operational</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <style>
    body{margin:0;padding:32px;background:#071114}
    .card-swipe{position:relative;width:360px;height:132px;margin:0 auto;overflow:hidden;border-radius:14px;background:#102226}
    .card-swipe__actions{position:absolute;inset:0;display:flex;justify-content:space-between}
    .card-swipe__action-zone{width:78px;display:flex;align-items:center;justify-content:center}
    .card-swipe__action-zone--left{background:#3a2f0e}
    .card-swipe__action-zone--right{background:#3e1418}
    .card-swipe__action{padding:9px 12px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(0,0,0,.12);color:#d7ffff;font:700 12px/1 "JetBrains Mono",monospace}
    .card-swipe__face{position:absolute;inset:0;display:flex;gap:14px;align-items:center;padding:20px;background:#071317;color:#d7ffff;border:1px solid #184f57;touch-action:none;cursor:grab;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease}
    .card-swipe[data-dragging="true"] .card-swipe__face{cursor:grabbing;transition:none;box-shadow:0 16px 24px rgba(0,0,0,.28)}
    .card-swipe__icon{font-size:24px;color:#67f2ff}
    .card-swipe__title{font:700 18px/1.1 "JetBrains Mono",monospace}
    .card-swipe__summary{margin-top:6px;font:400 12px/1.6 "JetBrains Mono",monospace;color:#8eb8bc}
    .status{width:360px;margin:12px auto 0;color:#82a7aa;font:12px/1.5 monospace}
  </style>
</head>
<body>
  <article class="card-swipe" data-open="none">
    <div class="card-swipe__actions">
      <div class="card-swipe__action-zone card-swipe__action-zone--left"><button class="card-swipe__action" type="button" data-action="ack">ACK</button></div>
      <div class="card-swipe__action-zone card-swipe__action-zone--right"><button class="card-swipe__action" type="button" data-action="drop">DROP</button></div>
    </div>
    <div class="card-swipe__face">
      <span class="material-symbols-outlined card-swipe__icon">warning</span>
      <div><h3 class="card-swipe__title">ALERT CLUSTER</h3><p class="card-swipe__summary">Swipe to acknowledge or drop the event.</p></div>
    </div>
  </article>
  <div class="status" id="status">Swipe left or right.</div>
  <script>
    const card=document.querySelector('.card-swipe');
    const face=card.querySelector('.card-swipe__face');
    const status=document.getElementById('status');
    const limit=96;
    const threshold=52;
    let activeId=null;
    let startX=0;
    let baseX=0;
    let currentX=0;

    const clamp=value=>Math.max(-limit,Math.min(limit,value));
    const render=()=>{face.style.transform=`translateX(${currentX}px)`;};
    const setState=open=>{
      card.dataset.open=open;
      status.textContent=open==='left'?'ACK action ready.':open==='right'?'DROP action ready.':'Swipe left or right.';
    };

    face.addEventListener('pointerdown',e=>{
      activeId=e.pointerId;
      startX=e.clientX;
      baseX=currentX;
      card.dataset.dragging='true';
      face.setPointerCapture(e.pointerId);
    });

    face.addEventListener('pointermove',e=>{
      if(activeId!==e.pointerId)return;
      currentX=clamp(baseX+(e.clientX-startX));
      render();
    });

    const finish=e=>{
      if(activeId!==e.pointerId)return;
      face.releasePointerCapture(e.pointerId);
      card.dataset.dragging='false';
      currentX=currentX>threshold?78:currentX<-threshold?-78:0;
      render();
      setState(currentX>0?'left':currentX<0?'right':'none');
      activeId=null;
    };

    face.addEventListener('pointerup',finish);
    face.addEventListener('pointercancel',finish);

    card.querySelectorAll('.card-swipe__action').forEach(button=>{
      button.addEventListener('click',()=>{
        status.textContent=`Action: ${button.dataset.action}`;
        currentX=0;
        render();
        setState('none');
      });
    });
  </script>
</body>
</html>
