<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/swipeAction - 04_operational</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#071114}.card-swipe{position:relative;width:360px;height:132px;margin:0 auto;overflow:hidden;border-radius:14px;background:#102226}.card-swipe__actions{position:absolute;inset:0;display:flex;align-items:center;padding:0 14px}.card-swipe__actions--left{justify-content:flex-start;background:#3a2f0e}.card-swipe__actions--right{justify-content:flex-end;background:#3e1418}.card-swipe__action{padding:9px 12px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(0,0,0,.12);color:#d7ffff;font:700 12px/1 "JetBrains Mono",monospace}.card-swipe__face{position:absolute;inset:0;display:flex;gap:14px;align-items:center;padding:20px;background:#071317;color:#d7ffff;border:1px solid #184f57}.card-swipe__icon{font-size:24px;color:#67f2ff}.card-swipe__title{font:700 18px/1.1 "JetBrains Mono",monospace}.card-swipe__summary{margin-top:6px;font:400 12px/1.6 "JetBrains Mono",monospace;color:#8eb8bc}</style></head><body><article class="card-swipe"><div class="card-swipe__actions card-swipe__actions--left"><button class="card-swipe__action" type="button">ACK</button></div><div class="card-swipe__actions card-swipe__actions--right"><button class="card-swipe__action" type="button">DROP</button></div><div class="card-swipe__face"><span class="material-symbols-outlined card-swipe__icon">warning</span><div><h3 class="card-swipe__title">ALERT CLUSTER</h3><p class="card-swipe__summary">Swipe to acknowledge or drop the event.</p></div></div></article></body></html>
