<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/swipeAction - 03_editorial</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#f4efe8}.card-swipe{position:relative;width:360px;height:140px;margin:0 auto;overflow:hidden;border-radius:20px;background:#f1e7d7}.card-swipe__actions{position:absolute;inset:0;display:flex;align-items:center;padding:0 18px}.card-swipe__actions--left{justify-content:flex-start;background:#efe3d0}.card-swipe__actions--right{justify-content:flex-end;background:#ddd1c2}.card-swipe__action{padding:10px 16px;border:1px solid rgba(63,49,38,.2);border-radius:999px;background:rgba(255,255,255,.55);color:#433529;font:600 12px/1 Georgia,serif}.card-swipe__face{position:absolute;inset:0;display:flex;gap:14px;align-items:center;padding:22px;background:#faf5ee;color:#30251b;border:1px solid #d7cab9}.card-swipe__icon{font-size:28px;color:#8b7258}.card-swipe__title{font:700 25px/1.1 Georgia,serif}.card-swipe__summary{margin-top:6px;font:400 15px/1.65 Georgia,serif;color:#695442}</style></head><body><article class="card-swipe"><div class="card-swipe__actions card-swipe__actions--left"><button class="card-swipe__action" type="button">Save</button></div><div class="card-swipe__actions card-swipe__actions--right"><button class="card-swipe__action" type="button">Hide</button></div><div class="card-swipe__face"><span class="material-symbols-outlined card-swipe__icon">article</span><div><h3 class="card-swipe__title">Weekend Dispatch</h3><p class="card-swipe__summary">Swipe to save or hide this card.</p></div></div></article></body></html>
