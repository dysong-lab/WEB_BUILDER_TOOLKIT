<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/sortable - 04_operational</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#071114}.card-sortable__list{width:392px;margin:0 auto;display:flex;flex-direction:column;gap:10px}.card-sortable__item{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:12px;border:1px solid #184f57;background:#071317;color:#d7ffff;cursor:grab;user-select:none;touch-action:none}.card-sortable__item[data-drag-state="dragging"]{opacity:.45;border-style:dashed}.card-sortable__item[data-drag-target="above"]{box-shadow:inset 0 2px 0 #ffb300}.card-sortable__item[data-drag-target="below"]{box-shadow:inset 0 -2px 0 #ffb300}.card-sortable__handle,.card-sortable__icon{font-size:22px;color:#67f2ff}.card-sortable__title{font:700 16px/1.2 "JetBrains Mono",monospace}.card-sortable__summary{margin-top:6px;font:400 12px/1.6 "JetBrains Mono",monospace;color:#8eb8bc}</style></head><body><section class="card-sortable"><div class="card-sortable__list"><article class="card-sortable__item"><span class="material-symbols-outlined card-sortable__handle">drag_indicator</span><span class="material-symbols-outlined card-sortable__icon">priority_high</span><div><h3 class="card-sortable__title">ALARM P1</h3><p class="card-sortable__summary">Breaker cluster deviation</p></div></article><article class="card-sortable__item"><span class="material-symbols-outlined card-sortable__handle">drag_indicator</span><span class="material-symbols-outlined card-sortable__icon">bolt</span><div><h3 class="card-sortable__title">POWER P2</h3><p class="card-sortable__summary">Transient load spread</p></div></article><article class="card-sortable__item"><span class="material-symbols-outlined card-sortable__handle">drag_indicator</span><span class="material-symbols-outlined card-sortable__icon">thermostat</span><div><h3 class="card-sortable__title">THERMAL P3</h3><p class="card-sortable__summary">Cooling aisle drift</p></div></article></div></section><script>const list=document.querySelector('.card-sortable__list');let dragging=null;let draggingId=null;const clear=()=>list.querySelectorAll('.card-sortable__item').forEach(el=>{delete el.dataset.dragState;delete el.dataset.dragTarget;});list.querySelectorAll('.card-sortable__item').forEach((item,idx)=>{item.dataset.id='item-'+idx;item.addEventListener('pointerdown',e=>{dragging=item;draggingId=item.dataset.id;item.dataset.dragState='dragging';item.setPointerCapture(e.pointerId);});item.addEventListener('pointermove',e=>{if(!dragging||dragging!==item)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card-sortable__item');if(!target||target.dataset.id===draggingId)return;clear();dragging.dataset.dragState='dragging';const box=target.getBoundingClientRect();target.dataset.dragTarget=e.clientY<box.top+box.height/2?'above':'below';});item.addEventListener('pointerup',e=>{if(!dragging||dragging!==item)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card-sortable__item');if(target&&target.dataset.id!==draggingId){target.dataset.dragTarget==='below'?target.after(dragging):target.before(dragging);}dragging.releasePointerCapture(e.pointerId);dragging=null;draggingId=null;clear();});item.addEventListener('pointercancel',()=>{dragging=null;draggingId=null;clear();});});</script></body></html>
