<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Cards/Advanced/sortable - 04_operational</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <style>
    body{margin:0;padding:32px;background:#071114}
    .card-sortable__list{width:392px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
    .card-sortable__item{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:12px;border:1px solid #184f57;background:#071317;color:#d7ffff;cursor:grab;user-select:none;touch-action:none;position:relative;transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease}
    .card-sortable__item[data-drag-state="dragging"]{z-index:20;cursor:grabbing;opacity:.98;box-shadow:0 16px 30px rgba(0,0,0,.34);pointer-events:none}
    .card-sortable__placeholder{border-radius:12px;background:rgba(103,242,255,.08);border:1px dashed rgba(103,242,255,.36)}
    .card-sortable__handle,.card-sortable__icon{font-size:22px;color:#67f2ff}
    .card-sortable__title{font:700 16px/1.2 "JetBrains Mono",monospace}
    .card-sortable__summary{margin-top:6px;font:400 12px/1.6 "JetBrains Mono",monospace;color:#8eb8bc}
  </style>
</head>
<body>
  <section class="card-sortable">
    <div class="card-sortable__list">
      <article class="card-sortable__item">
        <span class="material-symbols-outlined card-sortable__handle">drag_indicator</span>
        <span class="material-symbols-outlined card-sortable__icon">priority_high</span>
        <div><h3 class="card-sortable__title">ALARM P1</h3><p class="card-sortable__summary">Breaker cluster deviation</p></div>
      </article>
      <article class="card-sortable__item">
        <span class="material-symbols-outlined card-sortable__handle">drag_indicator</span>
        <span class="material-symbols-outlined card-sortable__icon">bolt</span>
        <div><h3 class="card-sortable__title">POWER P2</h3><p class="card-sortable__summary">Transient load spread</p></div>
      </article>
      <article class="card-sortable__item">
        <span class="material-symbols-outlined card-sortable__handle">drag_indicator</span>
        <span class="material-symbols-outlined card-sortable__icon">thermostat</span>
        <div><h3 class="card-sortable__title">THERMAL P3</h3><p class="card-sortable__summary">Cooling aisle drift</p></div>
      </article>
    </div>
  </section>
  <script>
    const list=document.querySelector('.card-sortable__list');
    let dragging=null;
    let placeholder=null;
    let pointerOffsetY=0;
    let pointerOffsetX=0;

    const snapshotPositions=()=>new Map(
      [...list.children].filter(el=>el!==dragging&&el!==placeholder).map(el=>[el,el.getBoundingClientRect().top])
    );

    const animateShift=previous=>{
      [...list.children].forEach(el=>{
        if(el===dragging||!previous.has(el))return;
        const delta=previous.get(el)-el.getBoundingClientRect().top;
        if(!delta)return;
        el.style.transition='none';
        el.style.transform=`translateY(${delta}px)`;
        requestAnimationFrame(()=>{
          el.style.transition='transform .18s cubic-bezier(.2,.8,.2,1)';
          el.style.transform='';
        });
      });
    };

    const moveDraggedItem=clientY=>{
      const siblings=[...list.children].filter(el=>el!==dragging&&el!==placeholder);
      const next=siblings.find(el=>{
        const rect=el.getBoundingClientRect();
        return clientY<rect.top+rect.height/2;
      });
      const previous=snapshotPositions();
      if(next){
        if(next.previousElementSibling!==placeholder)list.insertBefore(placeholder,next);
      }else if(list.lastElementChild!==placeholder){
        list.appendChild(placeholder);
      }
      animateShift(previous);
    };

    list.querySelectorAll('.card-sortable__item').forEach(item=>{
      item.addEventListener('pointerdown',e=>{
        dragging=item;
        const rect=item.getBoundingClientRect();
        pointerOffsetY=e.clientY-rect.top;
        pointerOffsetX=e.clientX-rect.left;
        placeholder=document.createElement('div');
        placeholder.className='card-sortable__placeholder';
        placeholder.style.height=`${rect.height}px`;
        placeholder.style.width=`${rect.width}px`;
        list.insertBefore(placeholder,item.nextSibling);
        item.dataset.dragState='dragging';
        item.style.width=`${rect.width}px`;
        item.style.left=`${rect.left}px`;
        item.style.top=`${rect.top}px`;
        item.style.position='fixed';
        item.style.transition='none';
        item.setPointerCapture(e.pointerId);
        moveDraggedItem(e.clientY);
      });

      item.addEventListener('pointermove',e=>{
        if(dragging!==item)return;
        item.style.left=`${e.clientX-pointerOffsetX}px`;
        item.style.top=`${e.clientY-pointerOffsetY}px`;
        moveDraggedItem(e.clientY);
      });

      const finish=e=>{
        if(dragging!==item)return;
        item.releasePointerCapture(e.pointerId);
        list.insertBefore(item,placeholder);
        placeholder.remove();
        placeholder=null;
        item.style.removeProperty('width');
        item.style.removeProperty('left');
        item.style.removeProperty('top');
        item.style.removeProperty('position');
        item.style.transition='';
        delete item.dataset.dragState;
        dragging=null;
      };

      item.addEventListener('pointerup',finish);
      item.addEventListener('pointercancel',finish);
    });
  </script>
</body>
</html>
