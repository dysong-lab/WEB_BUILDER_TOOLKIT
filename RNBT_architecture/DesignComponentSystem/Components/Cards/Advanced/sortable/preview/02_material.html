<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/sortable - 02_material</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#eef2ff;font-family:Roboto,sans-serif}.card-sortable__list{width:392px;margin:0 auto;display:flex;flex-direction:column;gap:12px}.card-sortable__item{display:flex;gap:12px;align-items:flex-start;padding:18px;border-radius:20px;background:#fff;color:#21304e;box-shadow:0 8px 24px rgba(69,90,166,.12);cursor:grab;user-select:none;touch-action:none}.card-sortable__item[data-drag-state="dragging"]{opacity:.45;transform:scale(1.02)}.card-sortable__item[data-drag-target="above"]{box-shadow:inset 0 4px 0 #9cb0ff}.card-sortable__item[data-drag-target="below"]{box-shadow:inset 0 -4px 0 #9cb0ff}.card-sortable__handle,.card-sortable__icon{font-size:22px;color:#4763b8}.card-sortable__title{font:500 18px/1.2 Roboto,sans-serif}.card-sortable__summary{margin-top:6px;font:400 13px/1.6 Roboto,sans-serif;color:#60708f}</style></head><body><section class="card-sortable"><div class="card-sortable__list"><article class="card-sortable__item"><span class="material-symbols-outlined card-sortable__handle">drag_indicator</span><span class="material-symbols-outlined card-sortable__icon">widgets</span><div><h3 class="card-sortable__title">Favorites</h3><p class="card-sortable__summary">Custom widget order</p></div></article><article class="card-sortable__item"><span class="material-symbols-outlined card-sortable__handle">drag_indicator</span><span class="material-symbols-outlined card-sortable__icon">insights</span><div><h3 class="card-sortable__title">Insights</h3><p class="card-sortable__summary">Monitoring surface</p></div></article><article class="card-sortable__item"><span class="material-symbols-outlined card-sortable__handle">drag_indicator</span><span class="material-symbols-outlined card-sortable__icon">schedule</span><div><h3 class="card-sortable__title">Timeline</h3><p class="card-sortable__summary">Upcoming work</p></div></article></div></section><script>const list=document.querySelector('.card-sortable__list');let dragging=null;let draggingId=null;const clear=()=>list.querySelectorAll('.card-sortable__item').forEach(el=>{delete el.dataset.dragState;delete el.dataset.dragTarget;});list.querySelectorAll('.card-sortable__item').forEach((item,idx)=>{item.dataset.id='item-'+idx;item.addEventListener('pointerdown',e=>{dragging=item;draggingId=item.dataset.id;item.dataset.dragState='dragging';item.setPointerCapture(e.pointerId);});item.addEventListener('pointermove',e=>{if(!dragging||dragging!==item)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card-sortable__item');if(!target||target.dataset.id===draggingId)return;clear();dragging.dataset.dragState='dragging';const box=target.getBoundingClientRect();target.dataset.dragTarget=e.clientY<box.top+box.height/2?'above':'below';});item.addEventListener('pointerup',e=>{if(!dragging||dragging!==item)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card-sortable__item');if(target&&target.dataset.id!==draggingId){target.dataset.dragTarget==='below'?target.after(dragging):target.before(dragging);}dragging.releasePointerCapture(e.pointerId);dragging=null;draggingId=null;clear();});item.addEventListener('pointercancel',()=>{dragging=null;draggingId=null;clear();});});</script></body></html>
