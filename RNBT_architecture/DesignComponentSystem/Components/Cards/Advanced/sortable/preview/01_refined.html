<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/sortable - 01_refined</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#0d1427;font-family:Pretendard,sans-serif}.card-sortable__list{width:392px;margin:0 auto;display:flex;flex-direction:column;gap:12px}.card-sortable__item{display:flex;gap:12px;align-items:flex-start;padding:18px;border-radius:22px;background:linear-gradient(180deg,#111b36,#0b1225);color:#e8f2ff;box-shadow:0 18px 34px rgba(7,11,25,.26);cursor:grab;user-select:none;touch-action:none}.card-sortable__item[data-drag-state="dragging"]{opacity:.55;transform:scale(.98)}.card-sortable__item[data-drag-target="above"]{box-shadow:inset 0 3px 0 #8f6aff}.card-sortable__item[data-drag-target="below"]{box-shadow:inset 0 -3px 0 #8f6aff}.card-sortable__handle,.card-sortable__icon{font-size:22px;color:#8fa5ff}.card-sortable__title{font:700 18px/1.2 Pretendard,sans-serif}.card-sortable__summary{margin-top:6px;font:400 13px/1.6 Pretendard,sans-serif;color:#b6c4ec}.log{width:392px;margin:14px auto 0;color:#9fb0e8;font:12px/1.6 monospace}</style></head><body><section class="card-sortable"><div class="card-sortable__list"><article class="card-sortable__item"><span class="material-symbols-outlined card-sortable__handle">drag_indicator</span><span class="material-symbols-outlined card-sortable__icon">bolt</span><div><h3 class="card-sortable__title">Energy</h3><p class="card-sortable__summary">Realtime power pattern analysis</p></div></article><article class="card-sortable__item"><span class="material-symbols-outlined card-sortable__handle">drag_indicator</span><span class="material-symbols-outlined card-sortable__icon">paid</span><div><h3 class="card-sortable__title">Revenue</h3><p class="card-sortable__summary">Today +12.4%</p></div></article><article class="card-sortable__item"><span class="material-symbols-outlined card-sortable__handle">drag_indicator</span><span class="material-symbols-outlined card-sortable__icon">notifications</span><div><h3 class="card-sortable__title">Alerts</h3><p class="card-sortable__summary">3 active items</p></div></article></div></section><div class="log" id="log">Drag cards to reorder.</div><script>const list=document.querySelector('.card-sortable__list');const log=document.getElementById('log');let dragging=null;let draggingId=null;const clear=()=>list.querySelectorAll('.card-sortable__item').forEach(el=>{delete el.dataset.dragState;delete el.dataset.dragTarget;});const updateLog=()=>{log.textContent='order: '+[...list.querySelectorAll('.card-sortable__title')].map(el=>el.textContent).join(' > ')};list.querySelectorAll('.card-sortable__item').forEach((item,idx)=>{item.dataset.id='item-'+idx;item.addEventListener('pointerdown',e=>{dragging=item;draggingId=item.dataset.id;item.dataset.dragState='dragging';item.setPointerCapture(e.pointerId);});item.addEventListener('pointermove',e=>{if(!dragging||dragging!==item)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card-sortable__item');if(!target||target.dataset.id===draggingId)return;clear();dragging.dataset.dragState='dragging';const box=target.getBoundingClientRect();target.dataset.dragTarget=e.clientY<box.top+box.height/2?'above':'below';});item.addEventListener('pointerup',e=>{if(!dragging||dragging!==item)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card-sortable__item');if(target&&target.dataset.id!==draggingId){target.dataset.dragTarget==='below'?target.after(dragging):target.before(dragging);updateLog();}dragging.releasePointerCapture(e.pointerId);dragging=null;draggingId=null;clear();});item.addEventListener('pointercancel',()=>{dragging=null;draggingId=null;clear();});});</script></body></html>
