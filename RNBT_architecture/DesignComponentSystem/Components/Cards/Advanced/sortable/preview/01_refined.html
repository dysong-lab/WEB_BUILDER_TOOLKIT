<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Cards/Advanced/sortable - 01_refined</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <style>
    body{margin:0;padding:32px;background:#0d1427;font-family:Pretendard,sans-serif}
    .card-sortable__list{width:392px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
    .card-sortable__item{display:flex;gap:12px;align-items:flex-start;padding:18px;border-radius:22px;background:linear-gradient(180deg,#111b36,#0b1225);color:#e8f2ff;box-shadow:0 18px 34px rgba(7,11,25,.26);cursor:grab;user-select:none;touch-action:none;position:relative;transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease}
    .card-sortable__item[data-drag-state="dragging"]{z-index:4;cursor:grabbing;opacity:.96;box-shadow:0 28px 48px rgba(8,13,31,.42);transform:translateY(var(--drag-offset,0)) scale(1.015)}
    .card-sortable__handle,.card-sortable__icon{font-size:22px;color:#8fa5ff}
    .card-sortable__title{font:700 18px/1.2 Pretendard,sans-serif}
    .card-sortable__summary{margin-top:6px;font:400 13px/1.6 Pretendard,sans-serif;color:#b6c4ec}
    .log{width:392px;margin:14px auto 0;color:#9fb0e8;font:12px/1.6 monospace}
  </style>
</head>
<body>
  <section class="card-sortable">
    <div class="card-sortable__list">
      <article class="card-sortable__item">
        <span class="material-symbols-outlined card-sortable__handle">drag_indicator</span>
        <span class="material-symbols-outlined card-sortable__icon">bolt</span>
        <div><h3 class="card-sortable__title">Energy</h3><p class="card-sortable__summary">Realtime power pattern analysis</p></div>
      </article>
      <article class="card-sortable__item">
        <span class="material-symbols-outlined card-sortable__handle">drag_indicator</span>
        <span class="material-symbols-outlined card-sortable__icon">paid</span>
        <div><h3 class="card-sortable__title">Revenue</h3><p class="card-sortable__summary">Today +12.4%</p></div>
      </article>
      <article class="card-sortable__item">
        <span class="material-symbols-outlined card-sortable__handle">drag_indicator</span>
        <span class="material-symbols-outlined card-sortable__icon">notifications</span>
        <div><h3 class="card-sortable__title">Alerts</h3><p class="card-sortable__summary">3 active items</p></div>
      </article>
    </div>
  </section>
  <div class="log" id="log">Drag cards to reorder.</div>
  <script>
    const list=document.querySelector('.card-sortable__list');
    const log=document.getElementById('log');
    let dragging=null;
    let startY=0;

    const updateLog=()=>{
      log.textContent='order: '+[...list.querySelectorAll('.card-sortable__title')].map(el=>el.textContent).join(' > ');
    };

    const snapshotPositions=()=>new Map(
      [...list.children].filter(el=>el!==dragging).map(el=>[el,el.getBoundingClientRect().top])
    );

    const animateShift=previous=>{
      [...list.children].forEach(el=>{
        if(el===dragging||!previous.has(el))return;
        const delta=previous.get(el)-el.getBoundingClientRect().top;
        if(!delta)return;
        el.style.transition='none';
        el.style.transform=`translateY(${delta}px)`;
        requestAnimationFrame(()=>{
          el.style.transition='transform .18s cubic-bezier(.2,.8,.2,1)';
          el.style.transform='';
        });
      });
    };

    const moveDraggedItem=clientY=>{
      const siblings=[...list.children].filter(el=>el!==dragging);
      const next=siblings.find(el=>{
        const rect=el.getBoundingClientRect();
        return clientY<rect.top+rect.height/2;
      });
      const previous=snapshotPositions();
      if(next){
        if(next.previousElementSibling!==dragging)list.insertBefore(dragging,next);
      }else if(list.lastElementChild!==dragging){
        list.appendChild(dragging);
      }
      animateShift(previous);
    };

    list.querySelectorAll('.card-sortable__item').forEach(item=>{
      item.addEventListener('pointerdown',e=>{
        dragging=item;
        startY=e.clientY;
        item.dataset.dragState='dragging';
        item.style.transition='none';
        item.setPointerCapture(e.pointerId);
      });

      item.addEventListener('pointermove',e=>{
        if(dragging!==item)return;
        item.style.setProperty('--drag-offset',`${e.clientY-startY}px`);
        moveDraggedItem(e.clientY);
      });

      const finish=e=>{
        if(dragging!==item)return;
        item.releasePointerCapture(e.pointerId);
        item.style.removeProperty('--drag-offset');
        item.style.transition='';
        delete item.dataset.dragState;
        dragging=null;
        updateLog();
      };

      item.addEventListener('pointerup',finish);
      item.addEventListener('pointercancel',finish);
    });

    updateLog();
  </script>
</body>
</html>
