<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Cards/Advanced/sortable - 03_editorial</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
  <style>
    body{margin:0;padding:32px;background:#f4efe8}
    .card-sortable__list{width:392px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
    .card-sortable__item{display:flex;gap:12px;align-items:flex-start;padding:18px;border-radius:18px;border:1px solid #d7cab9;background:#faf5ee;color:#30251b;cursor:grab;user-select:none;touch-action:none;position:relative;transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease}
    .card-sortable__item[data-drag-state="dragging"]{z-index:4;cursor:grabbing;opacity:.97;box-shadow:0 18px 28px rgba(77,56,33,.18);transform:translateY(var(--drag-offset,0)) scale(1.01)}
    .card-sortable__handle,.card-sortable__icon{font-size:22px;color:#8b7258}
    .card-sortable__title{font:700 19px/1.15 Georgia,serif}
    .card-sortable__summary{margin-top:6px;font:400 14px/1.7 Georgia,serif;color:#695442}
  </style>
</head>
<body>
  <section class="card-sortable">
    <div class="card-sortable__list">
      <article class="card-sortable__item">
        <span class="material-symbols-outlined card-sortable__handle">drag_indicator</span>
        <span class="material-symbols-outlined card-sortable__icon">bookmark</span>
        <div><h3 class="card-sortable__title">Lead Essay</h3><p class="card-sortable__summary">Primary reading position</p></div>
      </article>
      <article class="card-sortable__item">
        <span class="material-symbols-outlined card-sortable__handle">drag_indicator</span>
        <span class="material-symbols-outlined card-sortable__icon">menu_book</span>
        <div><h3 class="card-sortable__title">Notebook</h3><p class="card-sortable__summary">Second pass references</p></div>
      </article>
      <article class="card-sortable__item">
        <span class="material-symbols-outlined card-sortable__handle">drag_indicator</span>
        <span class="material-symbols-outlined card-sortable__icon">article</span>
        <div><h3 class="card-sortable__title">Archive</h3><p class="card-sortable__summary">Long tail selections</p></div>
      </article>
    </div>
  </section>
  <script>
    const list=document.querySelector('.card-sortable__list');
    let dragging=null;
    let startY=0;

    const snapshotPositions=()=>new Map(
      [...list.children].filter(el=>el!==dragging).map(el=>[el,el.getBoundingClientRect().top])
    );

    const animateShift=previous=>{
      [...list.children].forEach(el=>{
        if(el===dragging||!previous.has(el))return;
        const delta=previous.get(el)-el.getBoundingClientRect().top;
        if(!delta)return;
        el.style.transition='none';
        el.style.transform=`translateY(${delta}px)`;
        requestAnimationFrame(()=>{
          el.style.transition='transform .18s cubic-bezier(.2,.8,.2,1)';
          el.style.transform='';
        });
      });
    };

    const moveDraggedItem=clientY=>{
      const siblings=[...list.children].filter(el=>el!==dragging);
      const next=siblings.find(el=>{
        const rect=el.getBoundingClientRect();
        return clientY<rect.top+rect.height/2;
      });
      const previous=snapshotPositions();
      if(next){
        if(next.previousElementSibling!==dragging)list.insertBefore(dragging,next);
      }else if(list.lastElementChild!==dragging){
        list.appendChild(dragging);
      }
      animateShift(previous);
    };

    list.querySelectorAll('.card-sortable__item').forEach(item=>{
      item.addEventListener('pointerdown',e=>{
        dragging=item;
        startY=e.clientY;
        item.dataset.dragState='dragging';
        item.style.transition='none';
        item.setPointerCapture(e.pointerId);
      });

      item.addEventListener('pointermove',e=>{
        if(dragging!==item)return;
        item.style.setProperty('--drag-offset',`${e.clientY-startY}px`);
        moveDraggedItem(e.clientY);
      });

      const finish=e=>{
        if(dragging!==item)return;
        item.releasePointerCapture(e.pointerId);
        item.style.removeProperty('--drag-offset');
        item.style.transition='';
        delete item.dataset.dragState;
        dragging=null;
      };

      item.addEventListener('pointerup',finish);
      item.addEventListener('pointercancel',finish);
    });
  </script>
</body>
</html>
