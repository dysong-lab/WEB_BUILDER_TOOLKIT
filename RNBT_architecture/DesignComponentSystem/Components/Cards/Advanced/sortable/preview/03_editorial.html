<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/sortable - 03_editorial</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:32px;background:#f4efe8}.card-sortable__list{width:392px;margin:0 auto;display:flex;flex-direction:column;gap:12px}.card-sortable__item{display:flex;gap:12px;align-items:flex-start;padding:18px;border-radius:18px;border:1px solid #d7cab9;background:#faf5ee;color:#30251b;cursor:grab;user-select:none;touch-action:none}.card-sortable__item[data-drag-state="dragging"]{opacity:.55;border-style:dashed}.card-sortable__item[data-drag-target="above"]{box-shadow:inset 0 2px 0 #6c543d}.card-sortable__item[data-drag-target="below"]{box-shadow:inset 0 -2px 0 #6c543d}.card-sortable__handle,.card-sortable__icon{font-size:22px;color:#8b7258}.card-sortable__title{font:700 19px/1.15 Georgia,serif}.card-sortable__summary{margin-top:6px;font:400 14px/1.7 Georgia,serif;color:#695442}</style></head><body><section class="card-sortable"><div class="card-sortable__list"><article class="card-sortable__item"><span class="material-symbols-outlined card-sortable__handle">drag_indicator</span><span class="material-symbols-outlined card-sortable__icon">bookmark</span><div><h3 class="card-sortable__title">Lead Essay</h3><p class="card-sortable__summary">Primary reading position</p></div></article><article class="card-sortable__item"><span class="material-symbols-outlined card-sortable__handle">drag_indicator</span><span class="material-symbols-outlined card-sortable__icon">menu_book</span><div><h3 class="card-sortable__title">Notebook</h3><p class="card-sortable__summary">Second pass references</p></div></article><article class="card-sortable__item"><span class="material-symbols-outlined card-sortable__handle">drag_indicator</span><span class="material-symbols-outlined card-sortable__icon">article</span><div><h3 class="card-sortable__title">Archive</h3><p class="card-sortable__summary">Long tail selections</p></div></article></div></section><script>const list=document.querySelector('.card-sortable__list');let dragging=null;let draggingId=null;const clear=()=>list.querySelectorAll('.card-sortable__item').forEach(el=>{delete el.dataset.dragState;delete el.dataset.dragTarget;});list.querySelectorAll('.card-sortable__item').forEach((item,idx)=>{item.dataset.id='item-'+idx;item.addEventListener('pointerdown',e=>{dragging=item;draggingId=item.dataset.id;item.dataset.dragState='dragging';item.setPointerCapture(e.pointerId);});item.addEventListener('pointermove',e=>{if(!dragging||dragging!==item)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card-sortable__item');if(!target||target.dataset.id===draggingId)return;clear();dragging.dataset.dragState='dragging';const box=target.getBoundingClientRect();target.dataset.dragTarget=e.clientY<box.top+box.height/2?'above':'below';});item.addEventListener('pointerup',e=>{if(!dragging||dragging!==item)return;const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.card-sortable__item');if(target&&target.dataset.id!==draggingId){target.dataset.dragTarget==='below'?target.after(dragging):target.before(dragging);}dragging.releasePointerCapture(e.pointerId);dragging=null;draggingId=null;clear();});item.addEventListener('pointercancel',()=>{dragging=null;draggingId=null;clear();});});</script></body></html>
