<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Cards/Advanced/expandable - 01_refined</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>
        body{margin:0;padding:40px;background:#0d1427;font-family:Pretendard,sans-serif;color:#d7e0ff}
        #app{width:360px;margin:0 auto}
        .log{margin-top:16px;font:12px/1.6 monospace;color:#9fb0e8}
        .card-expandable{position:relative;width:360px;padding:24px;border-radius:28px;overflow:hidden;cursor:pointer;background:radial-gradient(circle at top left,rgba(128,160,255,.25),transparent 40%),linear-gradient(180deg,#131d39 0%,#0c1325 100%);color:#e8f2ff;box-shadow:0 24px 48px rgba(7,11,25,.35),inset 0 1px 0 rgba(255,255,255,.12)}
        .card-expandable__toggle{position:absolute;top:18px;right:18px;width:36px;height:36px;border:0;border-radius:999px;background:rgba(255,255,255,.08);color:inherit}
        .card-expandable__header{display:flex;gap:16px;align-items:center}.card-expandable__icon{font-size:28px}.card-expandable__copy{display:flex;flex-direction:column;gap:4px}.card-expandable__subhead{font:600 11px/1.2 "Pretendard",sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.72}.card-expandable__headline{font:700 28px/1.05 "Pretendard",sans-serif}.card-expandable__summary{margin-top:18px;font:500 15px/1.6 "Pretendard",sans-serif;opacity:.88}.card-expandable__details{max-height:0;opacity:0;overflow:hidden;transition:max-height 220ms cubic-bezier(.22,1,.36,1),opacity 220ms ease}.card-expandable__details-text{padding-top:18px;font:400 14px/1.7 "Pretendard",sans-serif;color:rgba(232,242,255,.78)}.card-expandable__actions{display:flex;gap:10px;padding-top:16px}.card-expandable__action{padding:10px 14px;border-radius:999px;border:0;background:rgba(135,95,255,.18);color:inherit;font:600 13px/1 "Pretendard",sans-serif}.card-expandable[data-expanded="true"] .card-expandable__details{max-height:220px;opacity:1}.card-expandable[data-expanded="true"] .card-expandable__toggle{transform:rotate(180deg)}
    </style>
</head>
<body>
<div id="app">
    <article class="card-expandable" data-expanded="false">
        <button class="card-expandable__toggle" type="button" aria-label="Toggle details">
            <span class="material-symbols-outlined">expand_more</span>
        </button>
        <div class="card-expandable__header">
            <span class="material-symbols-outlined card-expandable__icon">memory</span>
            <div class="card-expandable__copy">
                <p class="card-expandable__subhead">Sector B-12</p>
                <h3 class="card-expandable__headline">Rack Thermal Drift</h3>
            </div>
        </div>
        <p class="card-expandable__summary">Average inlet temperature is rising by 2.1°C over baseline.</p>
        <div class="card-expandable__details">
            <p class="card-expandable__details-text">Cooling redundancy remains intact, but the northern aisle has sustained elevated intake variance for 14 minutes. Field tech inspection is recommended before peak demand begins.</p>
            <div class="card-expandable__actions">
                <button class="card-expandable__action" type="button">Inspect</button>
                <button class="card-expandable__action" type="button">Escalate</button>
            </div>
        </div>
    </article>
</div>
<div class="log" id="log"></div>
<script>
const card = document.querySelector('.card-expandable');
const log = document.getElementById('log');
card.addEventListener('click', (e) => {
    if (e.target.closest('.card-expandable__action')) {
        log.textContent = '@cardActionClicked';
        return;
    }
    card.dataset.expanded = String(card.dataset.expanded !== 'true');
    log.textContent = card.dataset.expanded === 'true' ? '@cardExpanded' : '@cardCollapsed';
});
</script>
</body>
</html>
