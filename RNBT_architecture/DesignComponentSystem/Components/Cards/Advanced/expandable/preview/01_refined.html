<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Cards/Advanced/expandable - 01_refined</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>body{margin:0;padding:40px;background:#0d1427;font-family:Pretendard,sans-serif;color:#d7e0ff}#app{width:360px;margin:0 auto}.log{margin-top:16px;font:12px/1.6 monospace;color:#9fb0e8}</style>
</head>
<body>
<div id="app"></div>
<div class="log" id="log"></div>
<script src="../../../../../../preview_runtime.js"></script>
<script>
(async()=>{await loadComponentAssets('app','../views/01_refined.html','../styles/01_refined.css');const root=document.getElementById('app');root.querySelector('.card-expandable__icon').textContent='memory';root.querySelector('.card-expandable__headline').textContent='Rack Thermal Drift';root.querySelector('.card-expandable__subhead').textContent='Sector B-12';root.querySelector('.card-expandable__summary').textContent='Average inlet temperature is rising by 2.1°C over baseline.';root.querySelector('.card-expandable__details-text').textContent='Cooling redundancy remains intact, but the northern aisle has sustained elevated intake variance for 14 minutes. Field tech inspection is recommended before peak demand begins.';const card=root.querySelector('.card-expandable');const toggle=()=>{card.dataset.expanded=String(card.dataset.expanded!=='true');document.getElementById('log').textContent=card.dataset.expanded==='true'?'@cardExpanded':'@cardCollapsed';};card.addEventListener('click',e=>{if(e.target.closest('.card-expandable__action')){document.getElementById('log').textContent='@cardActionClicked';return;}toggle();});})();
</script>
</body>
</html>
