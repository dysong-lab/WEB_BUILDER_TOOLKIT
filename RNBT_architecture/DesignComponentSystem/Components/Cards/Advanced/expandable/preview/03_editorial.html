<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/expandable - 03_editorial</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:40px;background:#f4efe8;color:#433529}#app{width:360px;margin:0 auto}.log{margin-top:16px;font:12px/1.6 monospace;color:#6b5a4a}.card-expandable{position:relative;width:360px;padding:26px;border-radius:22px;border:1px solid #d3c7b9;background:#faf5ee;color:#33271e;cursor:pointer}.card-expandable__toggle{position:absolute;top:16px;right:16px;width:36px;height:36px;border:1px solid #d3c7b9;border-radius:999px;background:#fffaf2;color:#5f4b3b}.card-expandable__header{display:flex;gap:16px;align-items:center}.card-expandable__icon{font-size:26px;color:#7c644f}.card-expandable__subhead{font:600 11px/1.2 Georgia,serif;letter-spacing:.12em;text-transform:uppercase;color:#8f7a67}.card-expandable__headline{font:700 29px/1.05 Georgia,serif}.card-expandable__summary{margin-top:18px;font:400 16px/1.7 Georgia,serif;color:#564434}.card-expandable__details{max-height:0;opacity:0;overflow:hidden;transition:max-height 320ms ease,opacity 320ms ease}.card-expandable__details-text{padding-top:18px;font:400 15px/1.8 Georgia,serif;color:#6d5947}.card-expandable__actions{display:flex;gap:10px;padding-top:16px}.card-expandable__action{padding:10px 14px;border:1px solid #c7b9aa;border-radius:999px;background:transparent;color:#4f3f31;font:600 12px/1 Georgia,serif;letter-spacing:.04em}.card-expandable[data-expanded="true"] .card-expandable__details{max-height:220px;opacity:1}.card-expandable[data-expanded="true"] .card-expandable__toggle{transform:rotate(180deg)}</style></head><body><div id="app"><article class="card-expandable" data-expanded="false"><button class="card-expandable__toggle" type="button" aria-label="Toggle details"><span class="material-symbols-outlined">expand_more</span></button><div class="card-expandable__header"><span class="material-symbols-outlined card-expandable__icon">article</span><div class="card-expandable__copy"><p class="card-expandable__subhead">Weekend edition</p><h3 class="card-expandable__headline">Dispatch Notes</h3></div></div><p class="card-expandable__summary">The opening scene is quiet, but the stakes are already visible.</p><div class="card-expandable__details"><p class="card-expandable__details-text">This card demonstrates the slower editorial expansion mode, where the body copy breathes into the layout instead of snapping open with a utility rhythm.</p><div class="card-expandable__actions"><button class="card-expandable__action" type="button">Read</button><button class="card-expandable__action" type="button">Save</button></div></div></article></div><div class="log" id="log"></div><script>const card=document.querySelector('.card-expandable');const log=document.getElementById('log');card.addEventListener('click',e=>{if(e.target.closest('.card-expandable__action')){log.textContent='@cardActionClicked';return;}card.dataset.expanded=String(card.dataset.expanded!=='true');log.textContent=card.dataset.expanded==='true'?'@cardExpanded':'@cardCollapsed';});</script></body></html>
