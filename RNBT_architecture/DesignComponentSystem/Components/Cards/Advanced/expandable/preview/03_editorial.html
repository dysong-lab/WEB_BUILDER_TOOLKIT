<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/expandable - 03_editorial</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:40px;background:#f4efe8;color:#433529}#app{width:360px;margin:0 auto}.log{margin-top:16px;font:12px/1.6 monospace;color:#6b5a4a}</style></head><body><div id="app"></div><div class="log" id="log"></div><script src="../../../../../../preview_runtime.js"></script><script>(async()=>{await loadComponentAssets('app','../views/03_editorial.html','../styles/03_editorial.css');const root=document.getElementById('app');root.querySelector('.card-expandable__icon').textContent='article';root.querySelector('.card-expandable__headline').textContent='Dispatch Notes';root.querySelector('.card-expandable__subhead').textContent='Weekend edition';root.querySelector('.card-expandable__summary').textContent='The opening scene is quiet, but the stakes are already visible.';root.querySelector('.card-expandable__details-text').textContent='This card demonstrates the slower editorial expansion mode, where the body copy breathes into the layout instead of snapping open with a utility rhythm.';const card=root.querySelector('.card-expandable');card.addEventListener('click',e=>{if(e.target.closest('.card-expandable__action')){document.getElementById('log').textContent='@cardActionClicked';return;}card.dataset.expanded=String(card.dataset.expanded!=='true');document.getElementById('log').textContent=card.dataset.expanded==='true'?'@cardExpanded':'@cardCollapsed';});})();</script></body></html>
