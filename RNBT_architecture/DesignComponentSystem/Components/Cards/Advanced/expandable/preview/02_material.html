<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/expandable - 02_material</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:40px;background:#e9eefc;font-family:Roboto,sans-serif;color:#203053}#app{width:360px;margin:0 auto}.log{margin-top:16px;font:12px/1.6 monospace;color:#53607e}.card-expandable{position:relative;width:360px;padding:24px;border-radius:24px;overflow:hidden;cursor:pointer;transition:box-shadow 220ms ease,transform 220ms ease;background:#f7f8ff;color:#1f2440;box-shadow:0 10px 26px rgba(61,85,170,.12)}.card-expandable__toggle{position:absolute;top:16px;right:16px;width:40px;height:40px;border:0;border-radius:20px;background:#dde4ff;color:#3352b8}.card-expandable__header{display:flex;gap:16px;align-items:center}.card-expandable__icon{font-size:28px;color:#3556bd}.card-expandable__subhead{font:500 12px/1.2 Roboto,sans-serif;color:#5b6285;text-transform:uppercase;letter-spacing:.08em}.card-expandable__headline{font:500 26px/1.1 Roboto,sans-serif;color:#1f2440}.card-expandable__summary{margin-top:16px;font:400 15px/1.6 Roboto,sans-serif;color:#4f5677}.card-expandable__details{max-height:0;opacity:0;overflow:hidden;transition:max-height 220ms ease,opacity 220ms ease}.card-expandable__details-text{padding-top:16px;font:400 14px/1.7 Roboto,sans-serif;color:#2f3555}.card-expandable__actions{display:flex;gap:10px;padding-top:16px}.card-expandable__action{padding:10px 16px;border-radius:20px;border:0;background:#dce4ff;color:#27449e;font:500 13px/1 Roboto,sans-serif}.card-expandable[data-expanded="true"]{box-shadow:0 18px 36px rgba(38,63,138,.18);transform:translateY(-2px)}.card-expandable[data-expanded="true"] .card-expandable__details{max-height:220px;opacity:1}.card-expandable[data-expanded="true"] .card-expandable__toggle{transform:rotate(180deg)}</style></head><body><div id="app"><article class="card-expandable" data-expanded="false"><button class="card-expandable__toggle" type="button" aria-label="Toggle details"><span class="material-symbols-outlined">expand_more</span></button><div class="card-expandable__header"><span class="material-symbols-outlined card-expandable__icon">database</span><div class="card-expandable__copy"><p class="card-expandable__subhead">Data platform</p><h3 class="card-expandable__headline">Pipeline Snapshot</h3></div></div><p class="card-expandable__summary">Two downstream consumers are waiting on schema confirmation.</p><div class="card-expandable__details"><p class="card-expandable__details-text">The ingest path is healthy and lag remains below the page SLA. The only blocker is a pending approval for the next transformation bundle.</p><div class="card-expandable__actions"><button class="card-expandable__action" type="button">Open</button><button class="card-expandable__action" type="button">Share</button></div></div></article></div><div class="log" id="log"></div><script>const card=document.querySelector('.card-expandable');const log=document.getElementById('log');card.addEventListener('click',e=>{if(e.target.closest('.card-expandable__action')){log.textContent='@cardActionClicked';return;}card.dataset.expanded=String(card.dataset.expanded!=='true');log.textContent=card.dataset.expanded==='true'?'@cardExpanded':'@cardCollapsed';});</script></body></html>
