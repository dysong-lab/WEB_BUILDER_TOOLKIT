<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/expandable - 02_material</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:40px;background:#e9eefc;font-family:Roboto,sans-serif;color:#203053}#app{width:360px;margin:0 auto}.log{margin-top:16px;font:12px/1.6 monospace;color:#53607e}</style></head><body><div id="app"></div><div class="log" id="log"></div><script src="../../../../../../preview_runtime.js"></script><script>(async()=>{await loadComponentAssets('app','../views/02_material.html','../styles/02_material.css');const root=document.getElementById('app');root.querySelector('.card-expandable__icon').textContent='database';root.querySelector('.card-expandable__headline').textContent='Pipeline Snapshot';root.querySelector('.card-expandable__subhead').textContent='Data platform';root.querySelector('.card-expandable__summary').textContent='Two downstream consumers are waiting on schema confirmation.';root.querySelector('.card-expandable__details-text').textContent='The ingest path is healthy and lag remains below the page SLA. The only blocker is a pending approval for the next transformation bundle.';const card=root.querySelector('.card-expandable');card.addEventListener('click',e=>{if(e.target.closest('.card-expandable__action')){document.getElementById('log').textContent='@cardActionClicked';return;}card.dataset.expanded=String(card.dataset.expanded!=='true');document.getElementById('log').textContent=card.dataset.expanded==='true'?'@cardExpanded':'@cardCollapsed';});})();</script></body></html>
