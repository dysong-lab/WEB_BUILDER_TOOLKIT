<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/expandable - 04_operational</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:40px;background:#071114;color:#d7ffff}#app{width:360px;margin:0 auto}.log{margin-top:16px;font:12px/1.6 "JetBrains Mono",monospace;color:#7fd3db}.card-expandable{position:relative;width:360px;padding:22px;border-radius:18px;border:1px solid #1a5d66;background:#081417;color:#d9ffff;cursor:pointer}.card-expandable__toggle{position:absolute;top:14px;right:14px;width:36px;height:36px;border:1px solid #1a5d66;border-radius:8px;background:rgba(0,229,255,.08);color:#67f2ff}.card-expandable__header{display:flex;gap:14px;align-items:center}.card-expandable__icon{font-size:24px;color:#67f2ff}.card-expandable__subhead{font:700 11px/1.2 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:#79b8bf}.card-expandable__headline{font:700 24px/1.1 "JetBrains Mono",monospace}.card-expandable__summary{margin-top:16px;font:500 14px/1.6 "JetBrains Mono",monospace;color:#b3dadd}.card-expandable__details{max-height:0;opacity:0;overflow:hidden;transition:max-height 80ms linear,opacity 80ms linear}.card-expandable__details-text{padding-top:16px;font:400 13px/1.7 "JetBrains Mono",monospace;color:#9dc9cd}.card-expandable__actions{display:flex;gap:8px;padding-top:14px}.card-expandable__action{padding:9px 12px;border:1px solid #1a5d66;border-radius:8px;background:rgba(0,229,255,.08);color:#67f2ff;font:600 12px/1 "JetBrains Mono",monospace}.card-expandable[data-expanded="true"]{box-shadow:0 0 0 2px rgba(0,229,255,.25)}.card-expandable[data-expanded="true"] .card-expandable__details{max-height:220px;opacity:1}.card-expandable[data-expanded="true"] .card-expandable__toggle{transform:rotate(180deg)}</style></head><body><div id="app"><article class="card-expandable" data-expanded="false"><button class="card-expandable__toggle" type="button" aria-label="Toggle details"><span class="material-symbols-outlined">expand_more</span></button><div class="card-expandable__header"><span class="material-symbols-outlined card-expandable__icon">memory</span><div class="card-expandable__copy"><p class="card-expandable__subhead">NODE GRID 04</p><h3 class="card-expandable__headline">ALERT CLUSTER</h3></div></div><p class="card-expandable__summary">3 linked warnings are waiting on operator acknowledgement.</p><div class="card-expandable__details"><p class="card-expandable__details-text">Breaker telemetry is stable, but the current spread on the adjacent feed continues to widen. Dispatch the nearest operator and keep the cluster expanded until manual confirmation returns.</p><div class="card-expandable__actions"><button class="card-expandable__action" type="button">Acknowledge</button><button class="card-expandable__action" type="button">Dispatch</button></div></div></article></div><div class="log" id="log"></div><script>const card=document.querySelector('.card-expandable');const log=document.getElementById('log');card.addEventListener('click',e=>{if(e.target.closest('.card-expandable__action')){log.textContent='@cardActionClicked';return;}card.dataset.expanded=String(card.dataset.expanded!=='true');log.textContent=card.dataset.expanded==='true'?'@cardExpanded':'@cardCollapsed';});</script></body></html>
