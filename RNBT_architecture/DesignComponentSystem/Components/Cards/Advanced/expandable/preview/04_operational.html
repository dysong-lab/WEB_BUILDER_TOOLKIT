<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>Cards/Advanced/expandable - 04_operational</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"><style>body{margin:0;padding:40px;background:#071114;color:#d7ffff}#app{width:360px;margin:0 auto}.log{margin-top:16px;font:12px/1.6 "JetBrains Mono",monospace;color:#7fd3db}</style></head><body><div id="app"></div><div class="log" id="log"></div><script src="../../../../../../preview_runtime.js"></script><script>(async()=>{await loadComponentAssets('app','../views/04_operational.html','../styles/04_operational.css');const root=document.getElementById('app');root.querySelector('.card-expandable__icon').textContent='memory';root.querySelector('.card-expandable__headline').textContent='ALERT CLUSTER';root.querySelector('.card-expandable__subhead').textContent='NODE GRID 04';root.querySelector('.card-expandable__summary').textContent='3 linked warnings are waiting on operator acknowledgement.';root.querySelector('.card-expandable__details-text').textContent='Breaker telemetry is stable, but the current spread on the adjacent feed continues to widen. Dispatch the nearest operator and keep the cluster expanded until manual confirmation returns.';const card=root.querySelector('.card-expandable');card.addEventListener('click',e=>{if(e.target.closest('.card-expandable__action')){document.getElementById('log').textContent='@cardActionClicked';return;}card.dataset.expanded=String(card.dataset.expanded!=='true');document.getElementById('log').textContent=card.dataset.expanded==='true'?'@cardExpanded':'@cardCollapsed';});})();</script></body></html>
